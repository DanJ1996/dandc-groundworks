  const shown=all.filter(q=>ui.quoteFilter==='all'||isOpenQ(q)).sort((a,b)=>(isOpenQ(b)-isOpenQ(a))||String(a.due||'9999').localeCompare(String(b.due||'9999'))||String(b.received||'').localeCompare(String(a.received||'')));
  const won=all.filter(q=>q.status==='Won'), decided=won.length+all.filter(q=>q.status==='Lost').length;
  const open=all.filter(isOpenQ), quoted=all.filter(q=>q.status==='Quoted'), visits=all.filter(visitDue);
  const onTender=open.reduce((s,q)=>s+quoteValue(q),0);
  const stats=`<div class="stats"><div class="stat"><span class="k">To price</span><span class="v">${all.filter(needsPrice).length}</span><span class="sub">${all.filter(q=>q.status==='New').length} new, not yet actioned</span></div><div class="stat"><span class="k">Site visits booked</span><span class="v">${visits.length}</span><span class="sub">${visits.length?'Next '+dayLabel(visits.map(q=>q.visitDate).sort()[0],today):'None in the diary'}</span></div><div class="stat"><span class="k">Quoted, awaiting answer</span><span class="v">${money0(quoted.reduce((t,q)=>t+quoteValue(q),0))}</span><span class="sub">${quoted.length} out with clients</span></div><div class="stat"><span class="k">Won</span><span class="v">${won.length}</span><span class="sub">${decided?Math.round(won.length/decided*100)+'% of '+decided+' decided':'No decisions yet'}</span></div></div>`;
  const add=`<section class="panel"><div class="panel-h"><h3>Log an enquiry</h3><span class="sub">Take it down while they are on the phone.</span></div><form class="panel-b form" data-form="quote">${quoteFields('quote',{received:today})}<div class="go"><button class="btn">Add enquiry</button></div></form></section>`;
  const staff=['Dan'].concat(list('employees').filter(e=>e.active!==false).map(e=>e.name)).filter((x,i,a)=>x&&a.indexOf(x)===i);
  const row=q=>{
    const key='quotes/'+q.id, vkey='visit/'+q.id;
    if(ui.edit===key)return `<li class="item editing"><form class="form" data-form="quoteEdit">${quoteFields('quoteEdit',q)}<div class="go"><button class="btn">Save</button><button type="button" class="btn ghost" data-act="cancel">Cancel</button></div></form></li>`;
    if(ui.edit===vkey)return `<li class="item editing"><p style="margin-bottom:10px"><strong>Site visit</strong> · ${esc(q.client)} · ${esc(q.site||'no site address yet')}</p><form class="form" data-form="visit">${fld('visit','visitDate','Date',q.visitDate||today,{type:'date',attrs:'required'})}${fld('visit','visitTime','Time',q.visitTime||'',{type:'time'})}${fld('visit','visitBy','Who is going',q.visitBy||'',{attrs:'list="dl-staff"'})}${fld('visit','visitNotes','Access, parking, what to measure',q.visitNotes||'',{cls:'wide'})}<div class="go"><button class="btn">Save visit</button>${q.visitDate?`<button type="button" class="btn ghost" data-act="clearVisit" data-id="${q.id}">Remove visit</button>`:''}<button type="button" class="btn ghost" data-act="cancel">Cancel</button></div></form></li>`;
    const d=q.due?dayDiff(q.due,today):null;
    // A priced enquiry has effectively been sent, so the "Quote due" chase disappears.
    const due=!q.due||quoteValue(q)?'':needsPrice(q)?pill(d<0?'bad':d<=7?'warn':'neutral',d<0?'Quote overdue '+(-d)+' days':d===0?'Quote due today':'Quote due '+fmtD(q.due)):`<span class="sub">Quote due ${fmtD(q.due)}</span>`;
    const v=quoteValue(q), linked=q.projectId&&S.projects[q.projectId];
    const contact=[q.phone,q.email].filter(Boolean).map(esc).join(' · ');
    const visitBtn=visitDue(q)?`<button type="button" class="btn sm" id="qvd-${q.id}" data-act="visitDone" data-id="${q.id}">Meeting done</button><button type="button" class="btn sm ghost" id="qv-${q.id}" data-act="edit" data-key="${vkey}">Change visit</button>`:isOpenQ(q)?`<button type="button" class="btn sm ghost" id="qv-${q.id}" data-act="edit" data-key="${vkey}">Book site visit</button>`:'';
    return `<li class="item${v?' quoted':isOpenQ(q)?' unpriced':''}"><div class="item-main"><strong>${esc(q.client)}</strong> · ${esc(q.job)}<div class="sub">${esc(q.workType||'')}${q.site?(q.workType?' · ':'')+esc(q.site)+mapLink(q.site):''}</div><div class="sub">${contact?contact+' · ':''}${esc(q.source||'Enquiry')} ${fmtD(q.received)}</div>${q.notes?`<div class="sub">${esc(q.notes)}</div>`:''}${q.visitDate&&q.visitNotes?`<div class="sub">Visit: ${esc(q.visitNotes)}</div>`:''}${q.meetNotes?`<div class="meetnotes"><b>Meeting notes</b>${esc(q.meetNotes)}</div>`:''}</div><div class="item-act">${visitPill(q,today)}${due}</div>${v?`<div class="item-amt"><span class="amt">${money(v)}</span><span class="sub">${linked&&num(linked.tender)>0?'tender':linked?'from pricing':'estimate'}</span></div>`:''}<div class="item-act"><select id="qs-${q.id}" data-chg="qstatus" data-id="${q.id}" aria-label="Status">${QSTATUS.map(s=>`<option${s===q.status?' selected':''}>${s}</option>`).join('')}</select>${visitBtn}<button type="button" class="btn sm${visitDue(q)?' ghost':''}" id="qp-${q.id}" data-act="priceQuote" data-id="${q.id}">${linked?'Open pricing':'Price it'}</button><button type="button" class="btn sm ghost" id="qe-${q.id}" data-act="edit" data-key="${key}">Edit</button>${del(key)}</div></li>`;
  };
  const listing=`<section class="panel"><div class="panel-h"><h3>Enquiries</h3><div class="item-act"><button type="button" class="btn sm ${ui.quoteFilter==='open'?'':'ghost'}" id="qf-open" data-act="qfilter" data-v="open">Open (${open.length})</button><button type="button" class="btn sm ${ui.quoteFilter==='all'?'':'ghost'}" id="qf-all" data-act="qfilter" data-v="all">All (${all.length})</button></div></div>${shown.length?`<ul class="items">${shown.map(row).join('')}</ul>`:empty(all.length?'No open enquiries':'No enquiries logged yet','Log each call or email as it comes in, book the site visit, then use Price it to build the quote off your rate card.')}${onTender>0?`<div class="listfoot"><span>Out on tender</span><strong>${money(onTender)} <span class="sub">${money(onTender*1.2)} inc VAT</span></strong></div>`:''}</section>`;
  return `<div class="head"><div><h2>Enquiries &amp; quotes</h2><p class="sub">From first call to site visit, price, and decision.</p></div></div><datalist id="dl-staff">${staff.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>${stats}${add}${listing}`;
};

views.projects=()=>{
  const p=ui.project&&S.projects[ui.project];
  if(p)return vProject({...p,id:ui.project});
  const hb=hoursByProject(), invBy={};
  list('invoices').forEach(i=>{if(i.projectId)invBy[i.projectId]=(invBy[i.projectId]||0)+num(i.net);});
  // Enquiries still being priced live a "project" record (created by Price it) linked from an
  // open quote. Those belong in Dayworks/enquiries, not here — only show them as projects once
  // the enquiry is Won.
  const qByProj={};list('quotes').forEach(q=>{if(q.projectId)qByProj[q.projectId]=q;});
  const all=list('projects').filter(p=>{const q=qByProj[p.id];return !q||q.status==='Won';}).sort((a,b)=>PSTATUS.indexOf(a.status)-PSTATUS.indexOf(b.status)||byName(a,b));
  const projTotal=all.reduce((s,p)=>s+(num(p.tender)||projTotals(p).total),0);
  const add=`<section class="panel"><div class="panel-h"><h3>New project</h3></div><form class="panel-b form" data-form="project">${fld('project','name','Project',"",{attrs:'required',cls:'wide'})}${fld('project','client','Client','')}${fld('project','site','Site','',{attrs:'data-addr autocomplete="off"'})}${sel('project','status','Stage','Pricing',PSTATUS.map(s=>[s,s]))}<div class="go"><button class="btn">Add and open</button></div></form></section>`;
  const rows=all.map(q=>{const h=hb[q.id]||{h:0,cost:0};return `<li class="item"><div class="item-main"><button type="button" class="link" id="po-${q.id}" data-act="openProject" data-id="${q.id}">${esc(q.name)}</button><div class="sub">${[q.client,q.site].filter(Boolean).map(esc).join(' · ')}${mapLink(q.site)}</div></div><div>${pill(projPill(q.status),q.status||'Pricing')}${q.status==='Ready to start'?`<div class="startrow">${q.startDate?pill('good','Starts '+fmtD(q.startDate)):pill('warn','Set start date')}</div>`:''}</div><div class="item-amt"><span class="amt">${q.tender?money(num(q.tender)):money(projTotals(q).total)}</span><span class="sub">${q.tender?'tender':(q.lines||[]).length+' lines'} · ${(q.docs||[]).length} docs</span></div><div class="item-amt"><span>${money(invBy[q.id]||0)} invoiced</span><span class="sub">${hrs(h.h)} h · ${money(h.cost)} labour</span></div></li>`;}).join('');
  return `<div class="head"><div><h2>Projects</h2><p class="sub">Open a project to price it off the rate card and attach its documents.</p></div></div>${add}<section class="panel"><div class="panel-h"><h3>All projects${all.length?' <span class="sub">'+all.length+'</span>':''}</h3></div>${all.length?`<ul class="items">${rows}</ul>`:empty('No projects yet','Add one above, or use Price it on a quote request.')}${projTotal>0?`<div class="listfoot"><span>Total</span><strong>${money(projTotal)} <span class="sub">${money(projTotal*1.2)} inc VAT</span></strong></div>`:''}</section>`;
};

function vProject(p){
  const t=projTotals(p), h=hoursByProject()[p.id]||{h:0,cost:0};
  const inv=list('invoices').filter(i=>i.projectId===p.id), invNet=sum(inv.map(i=>i.net)), paid=sum(inv.filter(i=>i.paid).map(i=>i.net));
  const pf=(k,label,o={})=>`<label class="f ${o.cls||''}"><span>${label}</span><input id="pf-${k}" value="${esc(p[k]??'')}" data-chg="pf" data-id="${p.id}" data-k="${k}" ${o.attrs||''}></label>`;
  const details=`<section class="panel"><div class="panel-h"><h3>Details</h3><div class="item-act">${p.site?mapLink(p.site):''}${del('projects/'+p.id,'Delete project')}</div></div><div class="panel-b form">${pf('name','Project',{cls:'wide'})}${pf('client','Client')}${pf('site','Site',{attrs:'data-addr autocomplete="off"'})}<label class="f"><span>Stage</span><select id="pf-status" data-chg="pf" data-id="${p.id}" data-k="status">${PSTATUS.map(s=>`<option${s===p.status?' selected':''}>${s}</option>`).join('')}</select></label><label class="f"><span>Start date</span><input id="pf-startDate" type="date" value="${esc(p.startDate||'')}" data-chg="pf" data-id="${p.id}" data-k="startDate"></label><label class="f"><span>End date</span><input id="pf-endDate" type="date" value="${esc(p.endDate||'')}" data-chg="pf" data-id="${p.id}" data-k="endDate"></label><label class="f"><span>Gang on this job</span><select id="pf-gang" data-chg="pf" data-id="${p.id}" data-k="gang"><option value="">Unassigned</option>${GANGS.map(g=>`<option value="${g.k}"${p.gang===g.k?' selected':''}>${esc(g.name)}</option>`).join('')}</select></label><label class="f full"><span>Notes</span><textarea id="pf-notes" data-chg="pf" data-id="${p.id}" data-k="notes">${esc(p.notes||'')}</textarea></label></div><div class="panel-b kv"><div><span class="sub">Priced</span><strong>${money(t.total)}</strong></div><div><span class="sub">Tender</span><strong>${p.tender?money(num(p.tender)):'—'}</strong></div><div><span class="sub">Invoiced</span><strong>${money(invNet)}</strong></div><div><span class="sub">Paid</span><strong>${money(paid)}</strong></div><div><span class="sub">Labour to date</span><strong>${money(h.cost)}</strong></div><div><span class="sub">Hours booked</span><strong>${hrs(h.h)}</strong></div></div></section>`;
  const rates=list('rates'), cats=[...new Set(rates.map(r=>r.cat||'Other'))].sort();
  const lines=p.lines||[];
  const ln=(l,k,cls,extra='')=>`<input id="ln-${l.id}-${k}" class="${cls}" value="${esc(nf(l[k]))}" data-chg="line" data-id="${p.id}" data-l="${l.id}" data-k="${k}" aria-label="${k}" ${extra}>`;
  const byCat={};lines.forEach(l=>{const c=l.cat||'Other';byCat[c]=(byCat[c]||0)+num(l.qty)*num(l.rate);});
  const pricing=`<section class="panel"><div class="panel-h"><h3>Pricing</h3><span class="sub">Rates are copied from the rate card when added, so later rate changes do not alter this price.</span></div>
  ${lines.length?`<div class="scroll-x" id="sx-lines"><table class="grid lines"><thead><tr><th>Item</th><th>Unit</th><th class="n">Qty</th><th class="n">Rate £</th><th class="n">Total</th><th></th></tr></thead><tbody>${lines.map(l=>`<tr><td>${ln(l,'desc','')}${l.code||l.cat?`<div class="sub">${[l.code,l.cat].filter(Boolean).map(esc).join(' · ')}</div>`:''}</td><td>${ln(l,'unit','u')}</td><td class="n">${ln(l,'qty','q','inputmode="decimal"')}</td><td class="n">${ln(l,'rate','rt','inputmode="decimal"')}</td><td class="n">${money(num(l.qty)*num(l.rate))}</td><td class="n">${del('line/'+p.id+'/'+l.id,'×')}</td></tr>`).join('')}</tbody></table></div>`:empty('No lines priced yet',rates.length?'Pick an item from the rate card below, enter the quantity, and add it.':'The rate card is empty. Add rates in the Rate card tab, or add custom lines below.')}
  <form class="panel-b form" data-form="addline"><label class="f wide"><span>Add from rate card</span><select id="addline-rateId" name="rateId"><option value="">Custom line (type your own)</option>${cats.map(c=>`<optgroup label="${esc(c)}">${rates.filter(r=>(r.cat||'Other')===c).sort((a,b)=>String(a.code||a.desc).localeCompare(String(b.code||b.desc))).map(r=>`<option value="${r.id}"${dv('addline','rateId','')===r.id?' selected':''}>${esc((r.code?r.code+' · ':'')+r.desc+' — '+money(num(r.rate))+'/'+(r.unit||'item'))}</option>`).join('')}</optgroup>`).join('')}</select></label>${fld('addline','qty','Quantity','1',{attrs:'inputmode="decimal"'})}<div class="go"><button class="btn">Add line</button></div></form>
  <div class="panel-b"><div class="totals">${Object.entries(byCat).sort().map(([c,v])=>`<div class="sub"><span>${esc(c)}</span><span>${money(v)}</span></div>`).join('')}<div><span>Subtotal</span><strong>${money(t.sub)}</strong></div><div><label for="pf-markup">Overheads &amp; profit %</label><span><input id="pf-markup" value="${esc(nf(p.markup||''))}" inputmode="decimal" data-chg="pf" data-id="${p.id}" data-k="markup"> ${money(t.mk)}</span></div><div class="grand"><span>Price ex VAT</span><span>${money(t.total)}</span></div></div></div></section>`;
  const docs=p.docs||[];
  const scan=ui.tenderScan&&ui.tenderScan.pid===p.id?ui.tenderScan:null;
  const tv=num(p.tender);
  // VAT rate on the tender is a dropdown of the UK rates (default 20%). Pick 0% for reverse charge
  // / zero rated, 5% reduced rate, or 20% standard. Stored per project as vatRate.
  const vr=p.vatRate===''||p.vatRate==null?20:num(p.vatRate);
  const tenderBox=`<section class="panel" data-droptender="${p.id}"><div class="panel-h"><h3>Tender</h3><span class="sub">Type the figure, or drop a tender PDF or Excel here to read it.</span></div><div class="panel-b form"><label class="f"><span>Tender price (ex VAT) £</span><input id="pf-tender" value="${esc(nf(p.tender||''))}" inputmode="decimal" placeholder="e.g. 12500" data-chg="pf" data-id="${p.id}" data-k="tender"></label><label class="f"><span>VAT rate</span><select id="pf-vatRate" data-chg="pf" data-id="${p.id}" data-k="vatRate">${[[20,'20% — standard'],[5,'5% — reduced rate'],[0,'0% — zero / reverse charge']].map(([r,l])=>`<option value="${r}"${vr===r?' selected':''}>${l}</option>`).join('')}</select></label></div>${tv?`<div class="panel-b"><div class="totals"><div><span>Tender (ex VAT)</span><strong>${money(tv)}</strong></div><div class="sub"><span>VAT at ${vr}%</span><span>${money(tv*vr/100)}</span></div><div class="grand"><span>Total inc VAT</span><span>${money(tv*(1+vr/100))}</span></div></div></div>`:''}<div class="panel-b">${assets?`<label class="btn sm filebtn">${scan&&scan.busy?'Reading the file…':'Read a PDF or Excel'}<input class="vh" type="file" accept=".pdf,.xlsx,.xlsm,application/pdf" data-chg="tenderFile" data-id="${p.id}"${scan&&scan.busy?' disabled':''}></label><p class="dw-xhint" style="margin-top:8px">Or drag a tender PDF or Excel onto this panel.</p>`:'<p class="dw-xhint">This view cannot read files here — type the tender figure above.</p>'}${scan&&!scan.busy?(scan.amounts.length?(()=>{const bottom=pickBottom(scan.amounts);return `<p class="dw-xhint" style="margin:14px 0 6px">The bottom line is the final total ex VAT (your "plus VAT" figure). Tap it to set the tender, or pick another figure.</p><button type="button" class="btn" data-act="useTender" data-id="${p.id}" data-v="${bottom.val}" style="width:100%">Bottom line — ${money(bottom.val)}</button><div class="dw-xbtns" style="margin-top:10px">${scan.amounts.map(a=>`<button type="button" class="btn sm ghost" data-act="useTender" data-id="${p.id}" data-v="${a.val}">${money(a.val)}${a.ctx?`<span class="sub" style="display:block;font-weight:400">${esc(a.ctx)}</span>`:''}</button>`).join('')}</div>`;})():`<p class="dw-xhint" style="margin-top:12px">${scan.error==='fail'?'Could not read that file. If a PDF is a scan/photo it has no text — type the figure in manually above.':'No £ figures found. Type the tender figure above.'}</p>`):''}</div></section>`;
  const documents=`<section class="panel"><div class="panel-h"><h3>Documents</h3>${assets?`<label class="btn sm filebtn">${ui.busy==='upload'?'Uploading…':'Add PDFs'}<input class="vh" type="file" id="doc-up" accept="application/pdf,image/png,image/jpeg" multiple data-chg="upload" data-id="${p.id}"${ui.busy==='upload'?' disabled':''}></label>`:''}</div>${docs.length?`<ul class="items">${docs.map(d=>`<li class="item"><div class="item-main"><a href="/_blob/${esc(d.id)}" target="_blank" rel="noopener">${esc(d.name)}</a><div class="sub">${size(num(d.size))} · added ${fmtD(d.added,true)}</div></div>${assets?`<div class="item-act">${del('doc/'+p.id+'/'+d.id,'Remove')}</div>`:''}</li>`).join('')}</ul>`:empty('No documents attached',assets?'Add drawings, specs, tender documents and quotes as PDFs (up to 20 MB each).':'Documents can be added by people with edit access to this page.')}</section>`;
  return `<div class="head"><div><button type="button" class="btn ghost sm" id="p-back" data-act="closeProject">‹ All projects</button></div></div><div class="head"><div><h2>${esc(p.name)}</h2><p class="sub">${[p.client,p.site].filter(Boolean).map(esc).join(' · ')}</p></div><div class="item-act"><a class="btn sm" href="https://go.xero.com/AccountsReceivable/Search.aspx" target="_blank" rel="noopener">Invoice in Xero</a>${pill(projPill(p.status),p.status||'Pricing')}</div></div>${details}${tenderBox}${pricing}${documents}`;
}

const invFields=(f,i,edit)=>{
  const projs=[['','No project']].concat(list('projects').sort(byName).map(p=>[p.id,p.name]));
  return fld(f,'number','Invoice no.',i.number,{attrs:'placeholder="INV-0001"'})+sel(f,'projectId','Project',i.projectId||'',projs,{cls:'wide'})+fld(f,'client','Client',i.client,{attrs:'placeholder="Filled from project if blank"'})+fld(f,'desc','For',i.desc,{cls:'wide',attrs:'placeholder="e.g. Valuation 3, Block B foundations"'})+fld(f,'net','Net £',nf(i.net||''),{attrs:'required inputmode="decimal"'})+sel(f,'vat','VAT',i.vat||'std',Object.entries(VAT))+fld(f,'sendBy','Send by',i.sendBy,{type:'date'})+fld(f,'terms','Terms (days)',nf(i.terms??30),{attrs:'inputmode="numeric"'})+(edit?fld(f,'sent','Sent on',i.sent,{type:'date'})+fld(f,'paid','Paid on',i.paid,{type:'date'}):'');
};
views.invoices=()=>{
  const today=todayISO(), month=today.slice(0,7);
  const inv=list('invoices').map(i=>({...i,st:invState(i,today)}));
  const g=a=>a.reduce((t,i)=>t+gross(i),0);
  const toSend=inv.filter(i=>i.st==='tosend'||i.st==='late').sort((a,b)=>String(a.sendBy||'9999').localeCompare(String(b.sendBy||'9999')));
  const awaiting=inv.filter(i=>i.st==='awaiting'||i.st==='overdue').sort((a,b)=>addDays(a.sent,termsOf(a)).localeCompare(addDays(b.sent,termsOf(b))));
  const paid=inv.filter(i=>i.st==='paid').sort((a,b)=>String(b.paid).localeCompare(String(a.paid)));
  const overdue=awaiting.filter(i=>i.st==='overdue'), paidM=paid.filter(i=>String(i.paid).slice(0,7)===month);
  const stats=`<div class="stats"><div class="stat"><span class="k">To send</span><span class="v">${money0(g(toSend))}</span><span class="sub">${toSend.length} to go out</span></div><div class="stat"><span class="k">Awaiting payment</span><span class="v">${money0(g(awaiting))}</span><span class="sub">${awaiting.length} sent</span></div><div class="stat${overdue.length?' bad':''}"><span class="k">Overdue</span><span class="v">${money0(g(overdue))}</span><span class="sub">${overdue.length} past terms</span></div><div class="stat"><span class="k">Paid in ${MON[+month.slice(5)-1]}</span><span class="v">${money0(g(paidM))}</span><span class="sub">${paidM.length} received</span></div></div>`;
  const add=`<section class="panel"><div class="panel-h"><h3>Add an invoice to send</h3></div><form class="panel-b form" data-form="invoice">${invFields('invoice',{sendBy:today},false)}<div class="go"><button class="btn">Add invoice</button></div></form></section>`;
  const xPill=s=>{s=String(s||'').toUpperCase();const paid=s==='PAID',sent=s==='AUTHORISED'||s==='SUBMITTED';return `<span class="inv-badge" style="background:${paid?'#2e9e5b':sent?'#c9892b':'#8a8f99'}">${paid?'Paid':sent?'Sent':s==='DRAFT'?'Draft':s==='VOIDED'?'Voided':esc(s||'—')}</span>`;};
  const projOpts=selId=>[['','— not linked to a job —']].concat(list('projects').sort(byName).map(p=>[p.id,p.name])).map(([v,l])=>`<option value="${esc(v)}"${v===(selId||'')?' selected':''}>${esc(l)}</option>`).join('');
  const xHref=x=>x.xero_id?`https://go.xero.com/AccountsReceivable/View.aspx?InvoiceID=${encodeURIComponent(x.xero_id)}`:'';
  const xRow=x=>{
    const linked=x.project_id?projName(x.project_id):'';
    const editing=ui.xlink===x.ref;
    const href=xHref(x);
    const subs=[x.date?fmtD(x.date):'',(x.ref&&x.ref!==x.number)?esc(x.ref):'',linked?'Linked to '+esc(linked):''].filter(Boolean).join(' · ');
    return `<li class="item"><div class="item-main"><strong>${esc(x.number||x.ref||'—')}</strong>${x.contact?' · '+esc(x.contact):''}${subs?`<div class="sub">${subs}</div>`:''}${editing?`<div class="sub"><select data-chg="xlinkPick" data-ref="${esc(x.ref)}" aria-label="Link this invoice to a job">${projOpts(x.project_id)}</select></div>`:''}</div><div>${xPill(x.status)}</div><div class="item-amt"><span class="amt">${money(num(x.total))}</span>${x.paid_date?`<span class="sub">Paid ${fmtD(x.paid_date)}</span>`:num(x.amount_due)?`<span class="sub">${money(num(x.amount_due))} due</span>`:''}</div><div class="item-act"><button type="button" class="btn sm ghost" data-act="xeroLink" data-ref="${esc(x.ref)}">${editing?'Done':x.project_id?'Change job':'Link to job'}</button>${href?`<a class="btn sm ghost" href="${href}" target="_blank" rel="noopener">Open in Xero</a>`:''}</div></li>`;
  };
  const xLinked=XERO.rows.filter(x=>x.project_id);
  const xFind=String(ui.xfind||'').trim().toLowerCase();
  // Ignore generic company words so pasting a whole client name ("Atlantis Developments/
  // Bayview Developments Ltd") still matches a "Bayview Developments Ltd" contact. We match
  // the full phrase OR any distinctive word of it.
  const xStop=new Set(['developments','development','ltd','limited','the','and','group','services','construction','builders','building']);
  const xTokens=xFind?xFind.split(/[^a-z0-9]+/).filter(t=>t.length>=3&&!xStop.has(t)):[];
  const xMatches=xFind?XERO.rows.filter(x=>{if(x.project_id)return false;const hay=[x.number,x.ref,x.contact].map(f=>String(f||'').toLowerCase()).join(' ');return hay.includes(xFind)||xTokens.some(t=>hay.includes(t));}).slice(0,20):[];
  let xBody;
  if(!XERO.rows.length){
    xBody=empty(XERO.loaded?'Nothing synced yet':'Not linked to Xero yet','Tap Connect to Xero, approve it once, then Refresh to pull your invoices and payments.');
  }else{
    const linkedList=xLinked.length?`<ul class="items">${xLinked.map(xRow).join('')}</ul>`:'';
    // When not searching, show the most recent invoices so the list is never blank;
    // searching narrows to matches. Linked ones are shown above and excluded here.
    const xRecent=XERO.rows.filter(x=>!x.project_id).slice(0,15);
    const results=xFind
      ?(xMatches.length?`<ul class="items" style="margin-top:.5rem">${xMatches.map(xRow).join('')}</ul>`:`<p class="sub" style="margin-top:.5rem">No invoice matches “${esc(ui.xfind)}”.</p>`)
      :`<p class="sub" style="margin:.6rem 0 .2rem">${xLinked.length?'Other recent invoices':'Your recent invoices'} — newest first. Tap Link to job to tie one to a project.</p><ul class="items">${xRecent.map(xRow).join('')}</ul>`;
    const search=`<div class="panel-b" style="border-top:1px solid var(--line)"><label class="sub" for="xfind">Find an invoice to link <span style="opacity:.7">(by number or client)</span></label><input id="xfind" type="search" data-chg="xfind" value="${esc(ui.xfind||'')}" placeholder="e.g. INV-0042 or Smith" style="width:100%;margin-top:.3rem"${ui.xfind?' autofocus':''}>${results}</div>`;
    xBody=linkedList+search;
  }
  const xero=`<section class="panel"><div class="panel-h"><h3>Xero <span class="sub">invoiced &amp; paid, straight from your books</span></h3><div class="item-act"><button type="button" class="btn sm ghost" data-act="xeroConnect">Connect to Xero</button><button type="button" class="btn sm" data-act="xeroSync"${XERO.busy?' disabled':''}>${XERO.busy?'Refreshing…':'Refresh from Xero'}</button></div></div>${xBody}</section>`;
  const row=i=>{
    const key='invoices/'+i.id;
    if(ui.edit===key)return `<li class="item editing"><form class="form" data-form="invoiceEdit">${invFields('invoiceEdit',i,true)}<div class="go"><button class="btn">Save</button><button type="button" class="btn ghost" data-act="cancel">Cancel</button></div></form></li>`;
    const act=i.st==='paid'?`<button type="button" class="btn sm ghost" id="iu-${i.id}" data-act="invSet" data-id="${i.id}" data-k="paid" data-v="">Not paid</button>`
      :i.sent?`<button type="button" class="btn sm" id="ip-${i.id}" data-act="invSet" data-id="${i.id}" data-k="paid" data-v="today">Mark paid</button><button type="button" class="btn sm ghost" id="iu-${i.id}" data-act="invSet" data-id="${i.id}" data-k="sent" data-v="">Not sent</button>`
      :`<button type="button" class="btn sm" id="is-${i.id}" data-act="invSet" data-id="${i.id}" data-k="sent" data-v="today">Mark sent</button>`;
    return `<li class="item"><div class="item-main"><strong>${esc(i.number||'No number')}</strong> · ${esc(i.client||'No client')}<div class="sub">${[projName(i.projectId),i.desc].filter(Boolean).map(esc).join(' · ')}</div></div><div>${invPill(i,i.st,today)}</div><div class="item-amt"><span class="amt">${money(num(i.net))}</span><span class="sub">${i.vat==='std'?money(gross(i))+' inc VAT':VAT[i.vat]||''}</span></div><div class="item-act">${act}<button type="button" class="btn sm ghost" id="ie-${i.id}" data-act="edit" data-key="${key}">Edit</button>${del(key)}</div></li>`;
  };
  const sec=(title,rows,emptyT,emptyD)=>`<section class="panel"><div class="panel-h"><h3>${title}</h3><span class="sub">${rows.length?money(rows.reduce((t,i)=>t+num(i.net),0))+' net':''}</span></div>${rows.length?`<ul class="items">${rows.map(row).join('')}</ul>`:empty(emptyT,emptyD)}</section>`;
  return `<div class="head"><div><h2>Invoices</h2><p class="sub">What needs sending, what has been sent, and what has been paid.</p></div></div>${stats}${xero}${add}${sec('To send',toSend,'Nothing waiting to go out','Add an invoice above with the date it should be sent.')}${sec('Sent, awaiting payment',awaiting,'Nothing awaiting payment','Invoices move here when you mark them sent.')}${paid.length?sec('Paid',paid.slice(0,25),'',''):''}`;
};

  const inp=(r,k,cls,extra='')=>`<input id="rc-${r.id}-${k}" class="${cls}" value="${esc(nf(r[k]))}" data-chg="rate" data-id="${r.id}" data-k="${k}" aria-label="${k}" ${extra}>`;

views.reminders=()=>{
  const all=list('reminders');
  const col=(owner,label)=>{
    const mine=all.filter(r=>r.owner===owner);
    const open=mine.filter(r=>!r.done).sort((a,b)=>((+b.pri||0)-(+a.pri||0))||(String(a.when||'9999').localeCompare(String(b.when||'9999')))||((a.created||0)-(b.created||0)));
    const done=mine.filter(r=>r.done).sort((a,b)=>(b.created||0)-(a.created||0));
    const form='reminder'+(owner==='dan'?'Dan':'Chris');
    const row=r=>{const ekey='rem/'+r.id;
      if(ui.edit===ekey)return `<li class="item editing"><form class="form rem-add" data-form="remEdit"><label class="f full"><span class="vh">Edit reminder</span><input id="remEdit-text" name="text" value="${esc(dv('remEdit','text',r.text))}" autocomplete="off"></label><label class="f when"><span class="vh">Remind me at</span><input id="remEdit-when" name="when" type="datetime-local" value="${esc(dv('remEdit','when',r.when||''))}"></label><div class="go"><button class="btn sm">Save</button><button type="button" class="btn sm ghost" data-act="cancel">Cancel</button></div></form></li>`;
      const pinned=!r.done&&(+r.pri||0)>0;
      return `<li class="item rem${r.done?' rem-done':''}${pinned?' rem-top':''}"><label class="rem-check"><input type="checkbox" data-chg="remDone" data-id="${r.id}"${r.done?' checked':''} aria-label="Mark done"></label><div class="item-main">${esc(r.text)}${r.when&&!r.done?`<div class="sub">${remDuePill(r.when)}</div>`:''}</div><div class="item-act"><button type="button" class="btn sm ghost" data-act="edit" data-key="${ekey}">Edit</button>${r.done?'':`<button type="button" class="btn sm ghost" data-act="remPin" data-id="${r.id}" data-pin="${pinned?'0':'1'}" title="${pinned?'Unpin':'Pin to top'}">${pinned?'Unpin':'↑ Pin'}</button>`}${del('reminders/'+r.id,'×')}</div></li>`;};
    const other=owner==='dan'?'Chris':'Dan';
    return `<section class="panel"><div class="panel-h"><h3>${label} <span class="sub">${open.length} to do</span></h3></div>`
      +`<form class="panel-b form rem-add" data-form="${form}"><label class="f full"><span class="vh">Add a reminder for ${label}</span><input id="${form}-text" name="text" placeholder="Add a reminder…" autocomplete="off"></label><label class="f when"><span class="vh">Remind me at (optional)</span><input id="${form}-when" name="when" type="datetime-local"></label><div class="go"><button class="btn sm">Add</button></div></form>`
      +(open.length||done.length
        ?`<ul class="items rem-list">${open.map(row).join('')}${done.length?`<li class="rem-sep">Done · ${done.length}</li>`+done.map(row).join(''):''}</ul>`
        :empty('Nothing yet','Type anything the moment it comes to you — it saves straight away and '+other+' sees it too.'))
      +`</section>`;
  };
  const nOn=('Notification' in window)&&Notification.permission==='granted';
  const nBtn=('Notification' in window)&&Notification.permission!=='denied'
    ?`<div class="item-act">${nOn?pill('good','Alerts on'):`<button type="button" class="btn sm" data-act="notifyOn">Turn on alerts</button>`}</div>`:'';
  // Put the signed-in director's own list first (top on a phone, left on a computer).
  const me=/chris/i.test(DWME.name||'')?'chris':'dan';
  const mine=me==='chris'?col('chris','Chris'):col('dan','Dan');
  const theirs=me==='chris'?col('dan','Dan'):col('chris','Chris');
  return `<div class="head"><div><h2>Reminders</h2><p class="sub">Your running list — type and it saves instantly. You both see each other's. Put a date and time on one and it pings you when it's due.</p></div>${nBtn}</div><div class="rem-cols">${mine}${theirs}</div>`;
};

/* Crew tab — holiday requests the lads send in. Directors approve or decline;
   the lad sees the decision in their app. Rows live in office_docs 'holidays'
   keyed <uid>__<id>, loaded live like everything else. */
views.crew=()=>{
  const hols=list('holidays').sort((a,b)=>String(b.created||0)-String(a.created||0)||String(b.from||'').localeCompare(String(a.from||'')));
  const pending=hols.filter(h=>h.status==='pending');
  const decided=hols.filter(h=>h.status!=='pending');
  const span=h=>h.from===h.to?fmtD(h.from):fmtD(h.from)+' – '+fmtD(h.to);
  const row=h=>{
    const st=h.status==='approved'?pill('good','Approved'):h.status==='declined'?pill('bad','Declined'):pill('warn','Pending');
    const act=h.status==='pending'
      ?`<button type="button" class="btn sm" data-act="holSet" data-id="${esc(h.id)}" data-v="approved">Approve</button><button type="button" class="btn sm ghost" data-act="holSet" data-id="${esc(h.id)}" data-v="declined">Decline</button>`
      :`<button type="button" class="btn sm ghost" data-act="holSet" data-id="${esc(h.id)}" data-v="pending">Reopen</button>`;
    return `<li class="item"><div>${st}</div><div class="item-main"><strong>${esc(h.name||'Crew')}</strong> · ${esc(span(h))} <span class="sub">(${num(h.days)||1} day${(num(h.days)||1)>1?'s':''})</span>${h.note?`<div class="sub">${esc(h.note)}</div>`:''}${h.decidedBy?`<div class="sub">${h.status==='approved'?'Approved':'Declined'} by ${esc(h.decidedBy)}</div>`:''}</div><div class="item-act">${act}</div></li>`;
  };
  const sec=(title,rows,emptyTxt)=>`<section class="panel"><div class="panel-h"><h3>${title}${rows.length?' <span class="sub">'+rows.length+'</span>':''}</h3></div>${rows.length?`<ul class="items">${rows.map(row).join('')}</ul>`:empty(emptyTxt,'')}</section>`;
  // Directors book their own time off — no approval, straight onto the schedule.
  const who=[...new Set([(DWME.name||'').trim(),...list('employees').filter(e=>e.active!==false).map(e=>(e.name||'').trim())].filter(Boolean))];
  const book=`<section class="panel"><div class="panel-h"><h3>Book time off</h3><span class="sub">Goes straight on the schedule — no approval needed.</span></div><form class="panel-b form" data-form="timeoff">${who.length?sel('timeoff','who','Who',who[0],who.map(n=>[n,n])):fld('timeoff','who','Who',DWME.name||'')}${fld('timeoff','from','From','',{type:'date',attrs:'required'})}${fld('timeoff','to','To (optional)','',{type:'date'})}${fld('timeoff','note','Note (optional)','',{cls:'wide'})}<div class="go"><button class="btn">Book it</button></div></form></section>`;
  return `<div class="head"><div><h2>Holidays</h2><p class="sub">Holiday requests from the lads — approve or decline and they'll see it straight away.</p></div></div>`
    +book
    +sec('Awaiting your decision',pending,'No requests waiting')
    +(decided.length?sec('Decided',decided,''):'');
};

/* ---------- actions ---------- */
const actions={
  tab(d){ui.tab=d.tab;ui.edit=null;ui.confirm=null;if(d.tab==='projects')ui.project=null;try{localStorage.setItem('dc-tab',d.tab);}catch(e){}try{history.replaceState(null,'','#'+d.tab);}catch(e){}window.scrollTo(0,0);},
  week(d){ui.week=+d.d?addDays(ui.week,+d.d):mondayOf(todayISO());},
  schedWeek(d){ui.schedWeek=+d.d?addDays(ui.schedWeek,+d.d):mondayOf(todayISO());if(ui.schedDay)ui.schedDay=addDays(ui.schedWeek,(parse(ui.schedDay).getUTCDay()+6)%7);},
  schedDay(d){ui.schedDay=(d.day&&d.day!==ui.schedDay)?d.day:null;if(ui.schedDay)ui.focusNext='sd-close';},
  schedDayStep(d){if(!ui.schedDay)return;ui.schedDay=addDays(ui.schedDay,+d.d);ui.schedWeek=mondayOf(ui.schedDay);ui.focusNext='sd-close';},
  ovSec(d){ui.ovOpen[d.k]=!ui.ovOpen[d.k];},
  tsGrid(){ui.tsGridOpen=!ui.tsGridOpen;},
  newDW(d){openDW({mode:d.mode||'dayworks',jobid:d.jobid,project:d.job});},
  openDWSheet(d){openDW({id:d.id});},
  moveDWask(d){ui.moveDW=d.id;ui.confirm=null;},
  // Pick a job in the select, then tap Done — reads the select value and moves the sheet.
  moveDWdo(d){const sel=document.getElementById('dwmove-'+d.id);const v=sel&&sel.value;if(!v){toast('Pick a job first');return;}const j=(DWDATA.jobs||[]).find(x=>x.id===v);if(!j)return;ui.moveDW=null;SB.from('sheets').update({project:j.title,client:j.client||null}).eq('id',d.id).then(r=>{if(r.error){toast('Move failed: '+(r.error.message||''));return;}toast('Sheet moved to '+j.title);if(dwLoad)dwLoad();});},
  delDWSheet(d){ui.confirm=null;if(!d.id)return;SB.from('sheets').delete().eq('id',d.id).then(r=>{if(r.error){toast('Delete failed: '+(r.error.message||''));return;}toast('Sheet deleted');if(dwLoad)dwLoad();});},
  refreshDW(){dwLoad();},
  dwWeek(d,el){dwExportWeek(d.job,d.week,el);},
  xeroConnect(){const u=(window.DW_CONFIG||{}).SUPABASE_URL;if(u)location.href=u+'/functions/v1/xero-oauth?start=1';},
  xeroSync(){xeroSyncNow();},
  // Open/close the little "link this invoice to a job" picker on a Xero row.
  xeroLink(d){ui.xlink=ui.xlink===d.ref?null:d.ref;},
  dwInv(d,el){const on=!!(el&&el.checked);write('dw_invoiced',d.id,'set',{on:on,at:Date.now(),by:DWME.name||''});toast(on?'Marked invoiced':'Marked not invoiced');},
  dwInvWk(d,el){const want=!!(el&&el.checked);const ids=(DWDATA.sheets||[]).filter(x=>(x.project||'—')===d.job&&(x.work_date?mondayOf(x.work_date):'—')===d.week).map(x=>x.id);if(!ids.length)return;ids.forEach(id=>write('dw_invoiced',id,'set',{on:want,at:Date.now(),by:DWME.name||''}));toast(want?'Whole week marked invoiced':'Week marked not invoiced');},
  dwCombine(d){ui.dwPick=ui.dwPick||{};ui.dwSel=ui.dwSel||{};ui.dwPick[d.job]=true;ui.dwSel[d.job]={};},
  dwCombineCancel(d){if(ui.dwPick)ui.dwPick[d.job]=false;if(ui.dwSel)ui.dwSel[d.job]={};},
  dwPickWk(d,el){ui.dwSel=ui.dwSel||{};const m=ui.dwSel[d.job]=ui.dwSel[d.job]||{};if(el&&el.checked)m[d.week]=true;else delete m[d.week];},
  dwCombineDo(d,el){const m=(ui.dwSel&&ui.dwSel[d.job])||{};const wks=Object.keys(m).filter(k=>m[k]);if(!wks.length){toast('Tick at least one week');return;}dwExportWeeks(d.job,wks,el);if(ui.dwPick)ui.dwPick[d.job]=false;},
  holSet(d){const h=S.holidays[d.id];if(!h)return;write('holidays',d.id,'update',d.v==='pending'?{status:'pending',decidedBy:'',decidedAt:0}:{status:d.v,decidedBy:DWME.name||'Director',decidedAt:Date.now()});toast(d.v==='approved'?'Holiday approved':d.v==='declined'?'Holiday declined':'Request reopened');},

/* ---------- schedule PHONE alerts (web push) ----------
   Each director turns alerts on once per phone. The subscription is stored in
   push_subs; a database trigger (office-push.sql) + edge function
   (supabase/functions/schedule-notify) then ping every director's phone when
   anything is added to the schedule — even with the app closed. On an iPhone
   this only works from the home-screen app (Share → Add to Home Screen). */
const PUSH={state:'',reg:null};
const pushIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const pushStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
function pushKey(){const b=((window.DW_CONFIG||{}).VAPID_PUBLIC_KEY||'').replace(/-/g,'+').replace(/_/g,'/');const r=atob(b+'='.repeat((4-b.length%4)%4));return Uint8Array.from(r,c=>c.charCodeAt(0));}
function pushSave(sub){
  if(!SB||!DWME.id)return Promise.resolve(false);
  return SB.from('push_subs').upsert({endpoint:sub.endpoint,user_id:DWME.id,sub:sub.toJSON(),device:(pushIOS?'iPhone/iPad':navigator.userAgent).slice(0,120)},{onConflict:'endpoint'}).then(r=>!r.error);
}
async function pushInit(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){PUSH.state=pushIOS&&!pushStandalone()?'ios-install':'unsupported';schedule();return;}
    PUSH.reg=await navigator.serviceWorker.register('office-sw.js',{scope:'office.html'});
    const sub=await PUSH.reg.pushManager.getSubscription();
    PUSH.state=Notification.permission==='denied'?'denied':sub?'on':'off';
    if(sub)pushSave(sub);   // keep the server copy fresh
  }catch(e){PUSH.state='unsupported';}
  schedule();
}
async function pushOn(){
  if(PUSH.state==='ios-install'){toast('On iPhone: tap Share → Add to Home Screen, open Site Office from your home screen, then turn alerts on there.');return;}
  if(!PUSH.reg){toast('This browser cannot do phone alerts');return;}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){PUSH.state=perm==='denied'?'denied':'off';schedule();toast('Alerts were not allowed. You can switch them on in your phone settings for Site Office.');return;}
  PUSH.state='busy';schedule();
  try{
    const sub=(await PUSH.reg.pushManager.getSubscription())||await PUSH.reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushKey()});
    const ok=await pushSave(sub);
    PUSH.state='on';schedule();
    toast(ok?'Phone alerts on — you will get a ping when anything is added to the schedule':'Alerts on here, but the server is not set up yet (run office-push.sql)');
  }catch(e){PUSH.state='off';schedule();toast('Could not turn alerts on: '+((e&&e.message)||'unknown error'));}
}
async function pushOff(){
  try{const sub=PUSH.reg&&await PUSH.reg.pushManager.getSubscription();if(sub){if(SB)await SB.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe();}}catch(e){}
  PUSH.state='off';schedule();toast('Phone alerts off on this device');
}
function pushTest(){
  if(!SB)return;
  SB.rpc('push_test').then(r=>toast(r.error?'Test failed — the server side is not set up yet':'Test sent — it should pop up in a few seconds'));
}
function pushCtl(){
  const s=PUSH.state;
  if(s==='on')return `${pill('good','Phone alerts on')} <button type="button" class="btn ghost sm" data-act="pushTest">Send test</button> <button type="button" class="btn ghost sm" data-act="pushOff">Turn off</button>`;
  if(s==='off')return `<button type="button" class="btn sm" data-act="pushOn">🔔 Turn on phone alerts</button>`;
  if(s==='busy')return pill('info','Turning on…');
  if(s==='ios-install')return `<button type="button" class="btn ghost sm" data-act="pushOn">🔔 Phone alerts: add to Home Screen first</button>`;
  if(s==='denied')return `<span class="sub">Alerts are blocked — allow notifications for Site Office in your phone settings.</span>`;
  return '';
}

function askNotify(tell){
  if(!('Notification' in window)){if(tell)toast('This browser cannot show alerts');return;}
  if(Notification.permission==='granted'){if(tell)toast('Alerts are already on');return;}
  Notification.requestPermission().then(p=>{toast(p==='granted'?'Alerts on — you will get a ping when a reminder is due':'Alerts are blocked in your browser settings. Reminders still show in the app.');schedule();}).catch(()=>{});

function extractAmounts(text){
  text=text.replace(/\s+/g,' ');
  const re=/£\s?(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/g;
  const out=[],seen={};let m;
  while(m=re.exec(text)){
    const val=parseFloat(m[1].replace(/,/g,''));
    if(!isFinite(val)||val<1)continue;
    const key=val.toFixed(2);if(seen[key])continue;seen[key]=1;
    const ctx=text.slice(Math.max(0,m.index-36),m.index).replace(/[^\x20-\x7E£]/g,' ').trim().slice(-30);
    out.push({val,ctx,idx:m.index});
  }
  out.sort((a,b)=>b.val-a.val);
  return out.slice(0,10);
}
// bottom line = the final TOTAL ex VAT (the tender field is ex VAT). The last money
// figure on a quote is usually "Total inc VAT"; if it's ≈ another figure × 1.2, that
// other figure is the ex-VAT total — pick it. Dan quotes as "£X plus VAT".
function pickBottom(a){
  if(!a||!a.length)return null;
  const last=a.reduce((x,y)=>y.idx>x.idx?y:x);
  const ex=a.find(o=>o.val<last.val&&Math.abs(last.val-o.val*1.2)<=o.val*0.002+0.05);
  return ex||last;
}

async function inflateRaw(bytes){const ds=new DecompressionStream('deflate-raw');const ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();return new Uint8Array(ab);}
function readZip(ab){
  const dv=new DataView(ab),u8=new Uint8Array(ab);
  let eocd=-1;for(let i=u8.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('not a zip');
  const count=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);
  const entries={},td=new TextDecoder();
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),compSize=dv.getUint32(p+20,true),nameLen=dv.getUint16(p+28,true),extraLen=dv.getUint16(p+30,true),cmtLen=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nameLen));
    entries[name]={method,compSize,lho};
    p+=46+nameLen+extraLen+cmtLen;
  }
  return {dv,u8,entries};
}
async function readZipText(z,name){
  const e=z.entries[name];if(!e)return '';
  const nLen=z.dv.getUint16(e.lho+26,true),xLen=z.dv.getUint16(e.lho+28,true);
  const start=e.lho+30+nLen+xLen;
  const data=z.u8.subarray(start,start+e.compSize);
  const raw=e.method===0?data:await inflateRaw(data);
  return new TextDecoder().decode(raw);
}
function extractSheetAmounts(xml){
  // numeric cells, INCLUDING formula cells: <c ...><f>SUM(..)</f><v>NUMBER</v></c>.
  // Totals/VAT are almost always formulas, so skipping <f> loses the bottom line.
  const out=[],seen={};let m;const re=/<c\b([^>]*)>(?:<f[^>]*\/>|<f[^>]*>[\s\S]*?<\/f>)?\s*<v>([^<]*)<\/v>/g;
  while(m=re.exec(xml)){
    const attrs=m[1];
    if(/\bt="(s|str|inlineStr|b|e)"/.test(attrs))continue;
    const val=parseFloat(m[2]);
    if(!isFinite(val)||val<1)continue;
    const key=val.toFixed(2);if(seen[key]!=null)continue;seen[key]=1;
    out.push({val,ctx:'',idx:m.index});
  }
  out.sort((a,b)=>b.val-a.val);

}

/* --- import a rate card from a CSV the director picks on their device --- */
function parseCSV(text){
  const rows=[];let row=[],field='',q=false;
  text=text.replace(/\r\n?/g,'\n');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}else field+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(field);field='';}
    else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
    else field+=c;
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
async function importRates(file){
  ui.busy='rates';schedule();
  try{
    const text=await file.text();
    const rows=parseCSV(text);
    if(!rows.length){toast('That CSV looks empty.');ui.busy='';schedule();return;}
    const head=rows[0].map(h=>String(h).trim().toLowerCase());
    const col=n=>head.findIndex(h=>h===n||h.indexOf(n)===0);
    const ci={cat:col('cat'),code:col('code'),desc:col('desc'),unit:col('unit'),rate:col('rate')};
    const hasHeader=ci.desc>-1||ci.rate>-1;
    const map=hasHeader?ci:{cat:0,code:1,desc:2,unit:3,rate:4};
    const body=hasHeader?rows.slice(1):rows;
    const existing=new Set(list('rates').map(r=>((r.code||'')+'|'+(r.desc||'')).trim().toLowerCase()));
    let added=0,skipped=0;
    for(const r of body){
      const g=k=>map[k]>-1?String(r[map[k]]??'').trim():'';
      const desc=g('desc');if(!desc)continue;
      const code=g('code');
      const key=(code+'|'+desc).toLowerCase();
      if(existing.has(key)){skipped++;continue;}
      existing.add(key);
      write('rates',uid(),'set',{cat:g('cat')||'Other',code:code,desc:desc,unit:g('unit')||'item',rate:num(g('rate'))});
      added++;
    }
    toast(added?('Imported '+added+' rate'+(added===1?'':'s')+(skipped?' · '+skipped+' already on the card':'')):(skipped?'All '+skipped+' rows were already on the card':'No usable rows found in that CSV'));

  ui.busy='';schedule();
}

function dwMakeRow(ov,type,data){
  data=data||{};const cols=dwCfg[type];
  const r=document.createElement('div');r.className='dw-row';r.dataset.type=type;
  cols.forEach(c=>{
    const cell=document.createElement('div');cell.className='dw-cell'+(c.wide?' wide':'')+(c.m?' dw-m':'')+(c.hire?' dw-hireonly':'');
    cell.innerHTML=`<label>${c.lab}</label>`;
    let inp;
    const selArr=c.selFn?c.selFn():c.sel;
    if(c.chk){
      /* tick box (e.g. plant "Hired in?") — saved as '1' / '' */
      cell.classList.add('dw-chkcell');
      const w=document.createElement('label');w.className='dw-chk';
      inp=document.createElement('input');inp.type='checkbox';inp.checked=!!data[c.k]&&data[c.k]!=='0';
      w.appendChild(inp);w.appendChild(document.createTextNode(' '+c.chk));
      inp.dataset.k=c.k;cell.appendChild(w);r.appendChild(cell);return;
    }
    if(selArr){
      inp=document.createElement('select');
      inp.innerHTML=`<option value="">${esc(c.ph||'Select…')}</option>`+selArr.map(v=>`<option>${esc(v)}</option>`).join('');
      const dv=data[c.k];
      if(dv!=null&&dv!==''){if(!selArr.includes(dv))inp.insertAdjacentHTML('beforeend',`<option>${esc(dv)}</option>`);inp.value=dv;}
    }else{
      inp=document.createElement('input');
      if(c.ph)inp.placeholder=c.ph;
      if(c.list)inp.setAttribute('list',c.list);
      if(c.num)inp.inputMode='decimal';
      if(c.out){inp.readOnly=true;inp.tabIndex=-1;inp.className='dw-out';}
      if(data[c.k]!=null)inp.value=data[c.k];
    }
    inp.dataset.k=c.k;cell.appendChild(inp);r.appendChild(cell);
  });
  const del=document.createElement('button');del.type='button';del.className='dw-del';del.textContent='×';del.title='Remove';
  del.addEventListener('click',()=>{r.remove();dwRecalc(ov);});
  r.appendChild(del);
  r.addEventListener('input',()=>{dwRecalcRow(r);dwRecalc(ov);});
  r.addEventListener('change',()=>{dwRecalcRow(r);dwRecalc(ov);});
  if(type==='plant'){const pd=r.querySelector('[data-k="desc"]');if(pd){dwCombo(pd,dwPlantList);pd.addEventListener('change',()=>dwFillPlantRate(ov,r,pd.value));pd.addEventListener('input',()=>dwFillPlantRate(ov,r,pd.value));}}
  if(type==='plant'){const hc=r.querySelector('[data-k="hired"]');const sync=()=>r.classList.toggle('dw-hired',!!(hc&&hc.checked));if(hc)hc.addEventListener('change',sync);sync();}
  if(type==='mat'){const md=r.querySelector('[data-k="desc"]');if(md){dwCombo(md,dwMatList);md.addEventListener('input',()=>dwFillMatRate(ov,r,md.value));md.addEventListener('change',()=>dwFillMatRate(ov,r,md.value));}}
  if(data&&Object.keys(data).length)dwRecalcRow(r);
  return r;
}
/* Director only: picking a material fills its rate-book unit cost (+ unit if blank).
   Crew never reach this branch — their money columns are hidden and no rate loads. */
function dwFillMatRate(ov,r,name){
  if(DWME.role!=='director')return;
  const m=dwMatRate(name);if(!m)return;
  const cost=r.querySelector('[data-k="cost"]'),unit=r.querySelector('[data-k="unit"]');
  if(cost&&m.rate)cost.value=m.rate;
  if(unit&&m.unit&&!unit.value)unit.value=m.unit;
  dwRecalcRow(r);dwRecalc(ov);
}
/* Remember a typed-in plant / machine (e.g. "Bench saw from Travis Perkins") so
   it's offered next time and syncs across devices. Director only — it's saved to
   the rate card's Plant category with no rate; crew have no rate-card write access,
   their one-off still saves on the sheet itself. Called on save so half-typed
   names never get stored. */
function dwRememberPlant(name){
  name=String(name||'').trim();
  if(name.length<2||DWME.role!=='director'||_DW_PLANT_HIDE.test(name))return;
  if(typeof write!=='function'||typeof uid!=='function')return;
  if(dwPlantList().some(v=>v.toLowerCase()===name.toLowerCase()))return;
  try{write('rates',uid(),'set',{cat:'Plant',code:'',desc:name,unit:'day',rate:0});}catch(e){}
}
/* Director only: picking plant fills its day rate from the rate card. */
function dwFillPlantRate(ov,r,name){
  if(DWME.role!=='director')return;
  const m=dwMatRate(name);if(!m||!m.rate)return;
  const rate=r.querySelector('[data-k="rate"]');if(rate)rate.value=m.rate;
  dwRecalcRow(r);dwRecalc(ov);
}
function dwRecalcRow(r){
  const type=r.dataset.type,get=k=>{const i=r.querySelector('[data-k="'+k+'"]');return i?num(i.value):0;};
  const out=r.querySelector('[data-k="total"]');let t=0;
  if(type==='labour'||type==='plant')t=get('hours')*get('rate');
  else if(type==='mat')t=get('qty')*get('cost');
  if(out)out.value=t?dwGbp(t):'';
}
function dwRecalc(ov){
  const sect=type=>{let s=0;ov.querySelectorAll('[data-rows="'+type+'"] .dw-row').forEach(r=>{const o=r.querySelector('[data-k="total"]');s+=num(o&&o.value);});return s;};
  const lab=sect('labour'),pl=sect('plant'),mat=sect('mat'),sub=lab+pl+mat;
  const mk=num(ov.querySelector('[data-f="f_markup"]').value),grand=sub*(1+mk/100);
  const set=(id,v)=>{const el=ov.querySelector('[data-s="'+id+'"]');if(el)el.textContent=v;};
  set('labour',dwGbp(lab));set('plant',dwGbp(pl));set('mat',dwGbp(mat));set('sub',dwGbp(sub));set('grand',dwGbp(grand));
  /* hired-in plant call-out so the office spots hire costs at a glance */
  const hl=ov.querySelector('[data-hirelist]');
  if(hl){const items=[];ov.querySelectorAll('[data-rows="plant"] .dw-row.dw-hired').forEach(r=>{const v=k=>{const i=r.querySelector('[data-k="'+k+'"]');return i?String(i.value||'').trim():'';};const d=v('desc')||'(plant not selected)',f=v('hiredfrom'),n=v('hours');items.push('<li>'+esc(d)+(f?' — from '+esc(f):'')+(n?' · '+esc(n)+' day'+(n==='1'?'':'s'):'')+'</li>');});
    hl.innerHTML=items.length?'<b>Hired-in plant</b><ul style="margin:6px 0 0 18px;padding:0">'+items.join('')+'</ul>':'';}
}

/* attachments */
function dwHandleFiles(ov,files){
  Array.prototype.forEach.call(files,function(file){
    if(file.type.indexOf('image/')===0){dwShrink(file,d=>dwAddThumb(ov,d));return;}
    if(file.size>6*1024*1024){toast('“'+file.name+'” is too big to attach (max 6 MB) — email that one instead.');return;}
    const r=new FileReader();r.onload=()=>dwAddFile(ov,file.name,r.result,file.type);r.readAsDataURL(file);
  });
}
function dwShrink(file,cb){
  const r=new FileReader();
  r.onload=function(){const img=new Image();img.onload=function(){
    let max=1400,w=img.width,h=img.height;if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.75));
  };img.src=r.result;};
  r.readAsDataURL(file);
}
function dwAddThumb(ov,dataURL,cap){
  const t=ov.querySelector('[data-thumbs]'),d=document.createElement('div');d.className='dw-thumb';
  d._att={kind:'image',data:dataURL,mime:'image/jpeg'};
  const im=document.createElement('img');im.src=dataURL;
  const ci=document.createElement('input');ci.className='dw-cap';ci.placeholder='Caption / reference…';if(cap)ci.value=cap;
  const x=document.createElement('button');x.type='button';x.className='dw-x';x.textContent='×';x.addEventListener('click',()=>d.remove());
  d.appendChild(x);d.appendChild(im);d.appendChild(ci);t.appendChild(d);
}
function dwAddFile(ov,name,dataURL,mime,cap){
  const t=ov.querySelector('[data-thumbs]'),d=document.createElement('div');d.className='dw-thumb';
  d._att={kind:'file',name:name,data:dataURL||'',mime:mime||'application/pdf'};

  if(dataURL){f.href=dataURL;f.target='_blank';f.rel='noopener';f.setAttribute('download',name);}
  f.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5z"/></svg>';
  const nm=document.createElement('span');nm.textContent=name;f.appendChild(nm);
  const ci=document.createElement('input');ci.className='dw-cap';ci.placeholder='Caption / reference…';if(cap)ci.value=cap;
  const x=document.createElement('button');x.type='button';x.className='dw-x';x.textContent='×';x.addEventListener('click',()=>d.remove());
  d.appendChild(x);d.appendChild(f);d.appendChild(ci);t.appendChild(d);
}

/* signature pad */
function dwInitPad(cv){
  const ctx=cv.getContext('2d');let drawing=false,dirty=false;
  function size(){
    const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    if(!r.width)return;
    if(cv.width!==r.width*dpr||cv.height!==r.height*dpr){
      const data=dirty?cv.toDataURL():null;
      cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1B2C3E';
      if(data){const i=new Image();i.onload=()=>ctx.drawImage(i,0,0,r.width,r.height);i.src=data;}
    }
  }
  const pos=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const start=e=>{e.preventDefault();drawing=true;dirty=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
  const end=()=>{drawing=false;};
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
  return {size,clear(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);const dpr=window.devicePixelRatio||1;ctx.setTransform(dpr,0,0,dpr,0,0);dirty=false;},
    data(){return dirty?cv.toDataURL('image/png'):'';},
    load(url){if(!url)return;const i=new Image();i.onload=()=>{const r=cv.getBoundingClientRect();ctx.drawImage(i,0,0,r.width,r.height);dirty=true;};i.src=url;}};
}

/* mode / blank / collect / restore / save / open */
function dwSetMode(ov,mode){
  mode=mode==='variation'?'variation':'dayworks';ov.dataset.mode=mode;
  ov.classList.toggle('dw-variation',mode==='variation');
  const dh=ov.querySelector('[data-dwdeschead]');if(dh)dh.textContent=mode==='variation'?'Description & Reason':'Description of Works';
}
function dwBlank(ov){
  ov.querySelectorAll('[data-f]').forEach(el=>el.value='');
  ov.querySelector('[data-thumbs]').innerHTML='';
  ov._pad1.clear();ov._pad2.clear();
  ['labour','plant','mat'].forEach(type=>{const c=ov.querySelector('[data-rows="'+type+'"]');c.innerHTML='';c.appendChild(dwMakeRow(ov,type));});
  ov.querySelector('[data-f="f_date"]').value=todayISO();
  ov.querySelector('[data-f="f_day"]').value=new Date().toLocaleDateString('en-GB',{weekday:'long'});
  dwRecalc(ov);
}
function dwCollect(ov){
  const s={v:1,mode:ov.dataset.mode||'dayworks',fields:{},lines:{labour:[],plant:[],mat:[]},attachments:[]};
  ov.querySelectorAll('[data-f]').forEach(el=>{s.fields[el.dataset.f]=el.value;});
  ['labour','plant','mat'].forEach(type=>{
    ov.querySelectorAll('[data-rows="'+type+'"] .dw-row').forEach(r=>{
      const o={};r.querySelectorAll('[data-k]').forEach(i=>{if(i.type==='checkbox'){if(i.checked)o[i.dataset.k]='1';}else if(!i.readOnly)o[i.dataset.k]=i.value;});
      if(type==='plant'&&!o.hired)delete o.hiredfrom;
      if(Object.keys(o).some(k=>o[k]&&o[k].trim()))s.lines[type].push(o);
    });
  });
  ov.querySelectorAll('[data-thumbs] .dw-thumb').forEach(d=>{if(!d._att||!d._att.data)return;const c=d.querySelector('.dw-cap');s.attachments.push({kind:d._att.kind,name:d._att.name||'',mime:d._att.mime||'',data:d._att.data,cap:c?c.value:''});});
  const p1=ov._pad1.data(),p2=ov._pad2.data();if(p1)s.sig1=p1;if(p2)s.sig2=p2;
  return s;
}
/* ===== keep every £ figure out of a crew member's browser entirely =====
   The money columns are already CSS-hidden for crew, but the raw rate/cost
   and markup still arrived in the sheet data (readable in dev-tools). For crew
   we STRIP them before restoring so they never reach the page, KEEP a positional
   copy, then REAPPLY on save so a crew edit can't wipe the office's pricing.
   The stored line totals are computed (readOnly) so they aren't saved anyway. */
const DW_MONEY={labour:['rate'],plant:['rate'],mat:['cost']};
function dwKeepMoney(s){
  const keep={markup:(s&&s.fields&&s.fields.f_markup)||'',lines:{labour:[],plant:[],mat:[]}};
  ['labour','plant','mat'].forEach(t=>{keep.lines[t]=((s&&s.lines&&s.lines[t])||[]).map(r=>{const o={};(DW_MONEY[t]||[]).forEach(k=>{o[k]=r[k];});return o;});});
  return keep;
}
function dwStripMoney(s){
  if(!s)return s;
  if(s.fields)s.fields.f_markup='';
  if(s.lines)['labour','plant','mat'].forEach(t=>{(s.lines[t]||[]).forEach(r=>{(DW_MONEY[t]||[]).forEach(k=>{delete r[k];});});});
  return s;
}
function dwReapplyMoney(s,keep){
  if(!keep||!s)return s;
  if(s.fields&&keep.markup!=null&&keep.markup!=='')s.fields.f_markup=keep.markup;
  ['labour','plant','mat'].forEach(t=>{const km=(keep.lines&&keep.lines[t])||[];((s.lines&&s.lines[t])||[]).forEach((r,i)=>{if(km[i])Object.keys(km[i]).forEach(k=>{if(km[i][k]!=null&&km[i][k]!=='')r[k]=km[i][k];});});});
  return s;
}
function dwCopyExcel(ov,which){
  const C=dwCollect(ov),L=C.lines;
  const clean=v=>(v==null?'':String(v)).replace(/[\t\r\n]+/g,' ').trim();
  let rows=[];
  if(which==='lp'){
    L.labour.forEach(r=>{const n=clean(r.name);if(n)rows.push(n+'\t'+clean(r.hours));});
    L.plant.forEach(r=>{const n=clean(r.desc);if(n)rows.push(n+'\t'+clean(r.hours));});
  }else if(which==='mat'){
    L.mat.forEach(r=>{const n=clean(r.desc);if(n)rows.push(n+'\t'+clean(r.qty));});
  }else{
    const d=clean((C.fields||{}).f_desc);if(d)rows.push(d);
  }
  const text=rows.join('\n');
  const where={lp:"paste at the day's keyword column (B)",mat:"paste at the material column (G)",desc:"paste into the day's description cell"}[which];
  if(!text){toast('Nothing to copy — '+(which==='desc'?'no description entered':'no '+(which==='lp'?'labour or plant':'materials')+' lines yet'));return;}
  const ok=()=>toast('Copied'+(which==='desc'?'':' '+rows.length+' line'+(rows.length===1?'':'s'))+' — '+where);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok).catch(()=>dwClipFallback(text,ok));
  else dwClipFallback(text,ok);
}
function dwClipFallback(text,ok){
  try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);ok();}
  catch(e){toast('Copy not supported on this device');}
}

/* ===== One-click Excel export — fills Dan's real Dayworks template (keeps his VLOOKUP pricing) ===== */
var DW_TPL='dayworks-template.xlsx';   // fixed path in the private office-files bucket
/* Day block: description cell row, first line row, number of line rows available */
var DW_XL_DAYS={Monday:{desc:9,row:10,n:6},Tuesday:{desc:16,row:17,n:5},Wednesday:{desc:22,row:23,n:5},Thursday:{desc:28,row:29,n:5},Friday:{desc:34,row:35,n:5},Saturday:{desc:40,row:41,n:5},Sunday:{desc:46,row:47,n:5}};
var DW_XL_ORDER=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(function(n){return DW_XL_DAYS[n];});
/* "Monday 26 Oct" — the day label cell (col A) gets the real day + date so combined weeks are distinguishable. */
function dwDayLabel(wd){if(!wd)return '';var dn=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][(parse(wd).getUTCDay()+6)%7];return dn+' '+fmtD(wd);}
var zipLib=null;
function loadZip(){
  if(zipLib)return Promise.resolve(zipLib);
  if(window.JSZip){zipLib=window.JSZip;return Promise.resolve(zipLib);}
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload=function(){zipLib=window.JSZip;zipLib?res(zipLib):rej(new Error('zip failed'));};
    s.onerror=function(){rej(new Error('zip failed to load'));};
    document.head.appendChild(s);
  });
}
/* --- Excel surgery: edit ONLY the value cells inside the template's sheet XML,
   keeping each cell's own style index (s="…") so the logo, navy headers, borders,
   dropdowns and VLOOKUP formulas stay byte-identical. Prices recalc on open
   (template keeps fullCalcOnLoad). --- */
var dwXesc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
function dwSetCell(xml,addr,kind,val){
  var re=new RegExp('<c r="'+addr+'"[^>]*?(/>|>[\\s\\S]*?</c>)');
  var m=xml.match(re);if(!m)return xml;            // target cell must pre-exist (it does in the template)
  var s=(m[0].match(/\ss="(\d+)"/)||[])[1];
  var sa=(s!=null?' s="'+s+'"':'');
  var cell;
  if(kind==='n'){var n=parseFloat(String(val).replace(/[^0-9.\-]/g,''));if(!isFinite(n))return xml;cell='<c r="'+addr+'"'+sa+'><v>'+n+'</v></c>';}
  else{if(val==='')return xml;cell='<c r="'+addr+'"'+sa+' t="inlineStr"><is><t xml:space="preserve">'+dwXesc(val)+'</t></is></c>';}
  return xml.replace(re,cell);
}
/* Build the exact strings the Copy buttons produce, so pricing fidelity == copy/paste. */
function dwExcelRows(C){
  var clean=function(v){return (v==null?'':String(v)).replace(/[\t\r\n]+/g,' ').trim();};
  var lp=[],mat=[];
  (C.lines.labour||[]).forEach(function(r){var n=clean(r.name);if(n)lp.push([n,clean(r.hours)]);});
  (C.lines.plant||[]).forEach(function(r){var n=clean(r.desc);if(n)lp.push([n,clean(r.hours)]);});
  (C.lines.mat||[]).forEach(function(r){var n=clean(r.desc);if(n)mat.push([n,clean(r.qty)]);});
  return {lp:lp,mat:mat};
}
/* Fill ONE day block in the sheet XML. Only writes value cells (B/C/G/H + description)
   — never a formula cell. Returns {xml, over} where over = lines that didn't fit. */
function dwFillDayXml(xml,block,d){
  if(d.dateLabel)xml=dwSetCell(xml,'A'+block.desc,'s',d.dateLabel);
  if(d.desc)xml=dwSetCell(xml,'B'+block.desc,'s',d.desc);
  (d.lp||[]).forEach(function(r,i){if(i>=block.n)return;xml=dwSetCell(xml,'B'+(block.row+i),'s',r[0]);xml=dwSetCell(xml,'C'+(block.row+i),'n',r[1]);});
  (d.mat||[]).forEach(function(r,i){if(i>=block.n)return;xml=dwSetCell(xml,'G'+(block.row+i),'s',r[0]);xml=dwSetCell(xml,'H'+(block.row+i),'n',r[1]);});
  var over=Math.max(0,(d.lp||[]).length-block.n)+Math.max(0,(d.mat||[]).length-block.n);
  return {xml:xml,over:over};
}
/* Find the Dayworks worksheet's part path inside the zip (name → r:id → rels),
   falling back to the usual sheet1.xml. */
function dwSheetPath(zip){
  var def='xl/worksheets/sheet1.xml';
  try{
    var wbf=zip.file('xl/workbook.xml');if(!wbf)return Promise.resolve(def);
    return wbf.async('string').then(function(wb){
      var m=wb.match(/<sheet\b[^>]*\bname="Dayworks"[^>]*\/?>/i);
      if(!m)return def;
      var rid=(m[0].match(/r:id="([^"]+)"/)||[])[1];
      if(!rid)return def;
      var relf=zip.file('xl/_rels/workbook.xml.rels');if(!relf)return def;
      return relf.async('string').then(function(rels){
        var rm=rels.match(new RegExp('<Relationship\\b[^>]*\\bId="'+rid+'"[^>]*>'));
        if(!rm)return def;
        var tgt=(rm[0].match(/Target="([^"]+)"/)||[])[1];
        if(!tgt)return def;
        return 'xl/'+tgt.replace(/^\/?xl\//,'').replace(/^\//,'');
      });
    });
  }catch(e){return Promise.resolve(def);}
}
/* Load template → edit only the Dayworks sheet XML → repackage. header={project,client};
   days=[{block, desc, lp, mat}] (one per day logged). Returns {blob, over}. */
function dwBuildWorkbook(JSZip,buf){return function(header,days){
  return JSZip.loadAsync(buf).then(function(zip){
    return dwSheetPath(zip).then(function(path){
      var f=zip.file(path)||zip.file('xl/worksheets/sheet1.xml');
      if(!f)throw new Error('That template has no Dayworks sheet');
      return f.async('string').then(function(xml){
        if(header&&header.project)xml=dwSetCell(xml,'C3','s',header.project);
        if(header&&header.client)xml=dwSetCell(xml,'C4','s',header.client);
        var over=0;
        (days||[]).forEach(function(d){var r=dwFillDayXml(xml,d.block,d);xml=r.xml;over+=r.over;});
        zip.file(f.name,xml);
        return zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}).then(function(blob){return {blob:blob,over:over};});
      });
    });
  });
};}
function dwDownload(blob,name){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}
function icsEsc(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function icsForVisit(q){
  var ymd=(q.visitDate||'').replace(/-/g,'');if(!ymd)return '';
  var pad=function(n){return String(n).padStart(2,'0');};
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  var uid='visit-'+(q.id||ymd)+'@dandcgroundworks.com';
  var y=+q.visitDate.slice(0,4),mo=+q.visitDate.slice(5,7)-1,da=+q.visitDate.slice(8,10),dt;
  if(q.visitTime&&/^\d{1,2}:\d{2}/.test(q.visitTime)){
    var hh=+q.visitTime.slice(0,2),mm=+q.visitTime.slice(3,5);
    var s=new Date(y,mo,da,hh,mm),e=new Date(y,mo,da,hh+1,mm);
    var fmt=function(x){return ''+x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';};
    dt='DTSTART:'+fmt(s)+'\r\nDTEND:'+fmt(e);
  }else{
    var n=new Date(y,mo,da+1),end=''+n.getFullYear()+pad(n.getMonth()+1)+pad(n.getDate());
    dt='DTSTART;VALUE=DATE:'+ymd+'\r\nDTEND;VALUE=DATE:'+end;
  }
  var desc=[q.job?'Job: '+q.job:'',q.phone?'Phone: '+q.phone:'',q.visitBy?'Who: '+q.visitBy:'',q.visitNotes?'Notes: '+q.visitNotes:''].filter(Boolean).join('\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//D&C Groundworks//Site Office//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+stamp,dt,'SUMMARY:'+icsEsc('Site visit: '+(q.client||'')),q.site?'LOCATION:'+icsEsc(q.site):'',desc?'DESCRIPTION:'+icsEsc(desc):'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
}
function dwUploadTemplate(file){
  if(!SB){toast('Not connected — check your connection');return;}
  if(!/\.xlsx$/i.test(file.name)){toast('Please choose your Dayworks .xlsx template');return;}
  toast('Saving your template…');
  SB.storage.from('office-files').upload(DW_TPL,file,{upsert:true,contentType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
    .then(function(r){toast(r.error?('Could not save template: '+(r.error.message||'')):'Template saved — "Export to Excel" is ready');});
}
/* Fetch the saved template, then run build(JSZip, buf) which returns {blob, over}. */
function dwWithTemplate(build){
  return loadZip().then(function(JSZip){
    return SB.storage.from('office-files').download(DW_TPL).then(function(dl){
      if(dl.error||!dl.data)throw new Error('no-template');
      return dl.data.arrayBuffer().then(function(buf){return build(JSZip,buf);});
    });
  });
}
function dwExportError(e){
  if(e&&e.message==='no-template')toast('No template saved yet — tap "Set / replace template" and choose your Dayworks .xlsx');
  else toast('Export failed: '+((e&&e.message)||'unknown'));
}
/* The client/main contractor for a job — from the live project, else the enquiry. */
function dwJobClient(job){
  var name=(job||'').trim();if(!name)return '';
  var p=Object.values(S.projects||{}).find(function(x){return x&&(x.name||'').trim()===name;});
  if(p&&(p.client||'').trim())return (p.client||'').trim();
  var j=(DWDATA.jobs||[]).find(function(x){return x&&(x.title||'').trim()===name;});
  return (j&&(j.client||'').trim())||'';
}
/* Export the single sheet open in the editor. */
function dwExportExcel(ov){
  if(!SB){toast('Not connected — check your connection');return;}
  var C=dwCollect(ov),f=C.fields||{};
  var day=(f.f_day||'').trim(),block=DW_XL_DAYS[day];
  if(!block){toast('Set the Day / Weekday (Monday–Sunday) so it lands in the right block');return;}
  var rows=dwExcelRows(C);
  if(!rows.lp.length&&!rows.mat.length){toast('Nothing to export yet — add labour, plant or materials first');return;}
  var btn=ov.querySelector('[data-dwexport]');
  var reset=function(){if(btn){btn.disabled=false;btn.textContent='Export to Excel';}};
  if(btn){btn.disabled=true;btn.textContent='Building…';}
  var project=(f.f_project||'').trim(),client=(f.f_client||'').trim()||dwJobClient(project);
  dwWithTemplate(function(JSZip,buf){
    var build=dwBuildWorkbook(JSZip,buf);
    return build({project:project,client:client},
      [{block:block,desc:(f.f_desc||'').trim(),lp:rows.lp,mat:rows.mat,dateLabel:dwDayLabel(f.f_date||todayISO())}]);
  }).then(function(r){
    var proj=(f.f_project||'sheet').replace(/[^\w ()\-]+/g,'').trim()||'sheet';
    var name='Dayworks '+proj+' '+(f.f_date||todayISO())+'.xlsx';
    dwDownload(r.blob,name);
    toast(r.over?('Exported — but '+r.over+' line(s) didn\u2019t fit the day block, check the sheet'):'Exported '+name);
  }).catch(dwExportError).then(reset,reset);
}
/* Export a whole week for one job: gathers every day works sheet saved against that
   job whose work date falls in the Mon–Sun week, drops each into its weekday block,
   and produces ONE file. "automatic" — no day-ticking. */
function dwExportWeek(job,weekMon,btn){
  if(!SB){toast('Not connected — check your connection');return;}
  var reset=function(){if(btn){btn.disabled=false;btn.textContent=btn.dataset.label||'Export week';}};
  if(btn){btn.dataset.label=btn.textContent;btn.disabled=true;btn.textContent='Building…';}
  var weekEnd=addDays(weekMon,6);
  var fallbackClient=dwJobClient(job);
  var mine=(DWDATA.sheets||[]).filter(function(x){
    return x.project===job && x.mode!=='variation' && x.work_date && x.work_date>=weekMon && x.work_date<=weekEnd;
  });
  if(!mine.length){toast('No day works sheets saved for that week');reset();return;}
  var ids=mine.map(function(x){return x.id;});
  SB.from('sheets').select('data,work_date,day,project,client').in('id',ids).then(function(res){
    if(res.error)throw new Error(res.error.message||'load failed');
    var recs=res.data||[];
    var header={project:'',client:''},days=[],usedBlocks={};
    recs.forEach(function(rec){
      var data=rec.data||{},f=data.fields||{};
      if(!header.project)header.project=(f.f_project||rec.project||'').trim();
      if(!header.client)header.client=(f.f_client||rec.client||'').trim();
      var dayName=(f.f_day||rec.day||'').trim();
      if(!dayName||!DW_XL_DAYS[dayName]){var wd=rec.work_date||f.f_date;if(wd)dayName=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][(parse(wd).getUTCDay()+6)%7];}
      var block=DW_XL_DAYS[dayName];if(!block)return;
      if(usedBlocks[dayName])return;                 // one sheet per weekday block
      usedBlocks[dayName]=1;
      var rows=dwExcelRows(data);
      if(!rows.lp.length&&!rows.mat.length)return;
      days.push({block:block,desc:(f.f_desc||'').trim(),lp:rows.lp,mat:rows.mat,dateLabel:dwDayLabel(rec.work_date||f.f_date)});
    });
    if(!header.project)header.project=(job||'').trim();
    if(!header.client)header.client=fallbackClient;
    if(!days.length)throw new Error('Nothing to export in that week');
    return dwWithTemplate(function(JSZip,buf){return dwBuildWorkbook(JSZip,buf)(header,days);}).then(function(r){
      var proj=(job||'sheet').replace(/[^\w ()\-]+/g,'').trim()||'sheet';
      var name='Dayworks '+proj+' w-e '+weekEnd+'.xlsx';
      dwDownload(r.blob,name);
      toast(r.over?('Exported '+days.length+' day(s) — but '+r.over+' line(s) didn\u2019t fit, check the sheet'):'Exported '+days.length+' day(s) — '+name);
    });
  }).catch(dwExportError).then(reset,reset);
}
/* Export several weeks of one job as ONE sheet: every logged day across the picked
   weeks is laid into the next day block in date order, with the real day + date in
   the label (e.g. "Monday 26 Oct") so weeks are distinguishable. One sheet = 7 blocks;
   beyond that it fills 7 and reports the overflow. */
function dwExportWeeks(job,weekMons,btn){
  if(!SB){toast('Not connected — check your connection');return;}
  weekMons=(weekMons||[]).slice().sort();
  if(!weekMons.length){toast('Tick at least one week');return;}
  if(weekMons.length===1){dwExportWeek(job,weekMons[0],btn);return;}
  var reset=function(){if(btn){btn.disabled=false;if(btn.dataset.label)btn.textContent=btn.dataset.label;}};
  if(btn){btn.dataset.label=btn.textContent;btn.disabled=true;btn.textContent='Building…';}
  var fallbackClient=dwJobClient(job);
  var wset={};weekMons.forEach(function(wm){wset[wm]=1;});
  var mine=(DWDATA.sheets||[]).filter(function(x){return x.project===job && x.mode!=='variation' && x.work_date && wset[mondayOf(x.work_date)];});
  if(!mine.length){toast('No day works sheets saved for those weeks');reset();return;}
  var ids=mine.map(function(x){return x.id;});
  SB.from('sheets').select('data,work_date,day,project,client').in('id',ids).then(function(res){
    if(res.error)throw new Error(res.error.message||'load failed');
    var recs=(res.data||[]).slice().sort(function(a,b){return String(a.work_date||'').localeCompare(String(b.work_date||''));});
    var header={project:'',client:''},entries=[];
    recs.forEach(function(rec){
      var data=rec.data||{},f=data.fields||{};
      if(!header.project)header.project=(f.f_project||rec.project||'').trim();
      if(!header.client)header.client=(f.f_client||rec.client||'').trim();
      var rows=dwExcelRows(data);
      if(!rows.lp.length&&!rows.mat.length)return;
      entries.push({wd:rec.work_date||f.f_date,desc:(f.f_desc||'').trim(),lp:rows.lp,mat:rows.mat});
    });
    if(!header.project)header.project=(job||'').trim();
    if(!header.client)header.client=fallbackClient;
    if(!entries.length)throw new Error('Nothing to export in those weeks');
    var cap=DW_XL_ORDER.length;
    var dropped=Math.max(0,entries.length-cap);
    var days=entries.slice(0,cap).map(function(e,i){return {block:DW_XL_ORDER[i],desc:e.desc,lp:e.lp,mat:e.mat,dateLabel:dwDayLabel(e.wd)};});
    return dwWithTemplate(function(JSZip,buf){return dwBuildWorkbook(JSZip,buf)(header,days);}).then(function(r){
      var proj=(job||'sheet').replace(/[^\w ()\-]+/g,'').trim()||'sheet';
      var last=entries[Math.min(entries.length,cap)-1].wd;
      var name='Dayworks '+proj+' '+entries[0].wd+' to '+last+'.xlsx';
      dwDownload(r.blob,name);
      var msg;
      if(dropped)msg='Exported first '+cap+' days — '+dropped+' more didn\u2019t fit one sheet (combine fewer weeks)';
      else msg='Exported '+days.length+' day(s) — '+name;
      if(r.over)msg+=' · '+r.over+' line(s) didn\u2019t fit a day block';
      toast(msg);
    });
  }).catch(dwExportError).then(reset,reset);
}
function dwRestore(ov,s){
