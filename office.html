<!doctype html><html data-theme="light"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>D&amp;C Site Office</title>
<link rel="manifest" href="office.webmanifest"><link rel="apple-touch-icon" href="assets/logo.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Site Office"><meta name="theme-color" content="#273E57">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@600;700&display=swap">
<style>
/* Layout: navy band with the tab rail; one working surface per tab. Each tab reads summary first, then the entry form, then the list it feeds. */
:root{
  --bg:#EDE7DF; --surface:#F9F6F1; --sunk:#E4DCD1; --ink:#1D2C3D; --muted:#586574; --line:#D3C9BB;
  --accent:#273E57; --on-accent:#F4EFE8; --band:#273E57; --on-band:#EDE7DF; --band-muted:#B4C0CC;
  --good:#2C7A4B; --warn:#9A5A08; --bad:#B23A2E; --info:#5AA7E0;
  --gang1:#273E57; --gang2:#2E6E8E; --gang3:#6B4E8E; --gang4:#8A6D1F;
  --display:'Poppins',system-ui,'Segoe UI',sans-serif; --body:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131C27; --surface:#1B2836; --sunk:#16212D; --ink:#EDE7DF; --muted:#A3AFBC; --line:#33455A;
  --accent:#EDE7DF; --on-accent:#1D2C3D; --band:#0E161F; --on-band:#EDE7DF; --band-muted:#93A2B3;
  --good:#74C493; --warn:#E6AC55; --bad:#F08A7E; --info:#9CCFF2; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131C27; --surface:#1B2836; --sunk:#16212D; --ink:#EDE7DF; --muted:#A3AFBC; --line:#33455A;
  --accent:#EDE7DF; --on-accent:#1D2C3D; --band:#0E161F; --on-band:#EDE7DF; --band-muted:#93A2B3;
  --good:#74C493; --warn:#E6AC55; --bad:#F08A7E; --info:#9CCFF2; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:1.25rem} h3{font-size:1rem}
p{margin:0}
a{color:inherit}
.sub{color:var(--muted);font-size:.87rem}
.n{text-align:right}

.band{background:var(--band);color:var(--on-band)}
.band-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding-block:16px 10px}
.mark{font:700 1.5rem/1 var(--display);letter-spacing:.01em}
.strap{color:var(--band-muted);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase}
.sync{margin-left:auto;color:var(--band-muted);font-size:.82rem}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;color:var(--band-muted);font:500 .93rem var(--body);padding:10px 14px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--on-band)}
.tab[aria-current="page"]{background:var(--bg);color:var(--ink);font-weight:600}
.count{background:var(--on-band);color:var(--band);border-radius:99px;font-size:.72rem;font-weight:600;padding:0 6px;min-width:18px;text-align:center}
.tab[aria-current="page"] .count{background:var(--accent);color:var(--on-accent)}

main{display:flex;flex-direction:column;gap:20px;padding-block:22px 56px}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.head > div{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 16px}
.panel-b{padding:14px 16px;border-top:1px solid var(--line)}
.dropdown-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;width:100%;padding:12px 16px;background:none;border:0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.dropdown-h .dropdown-t{font:600 1.05rem var(--display);display:flex;gap:8px;align-items:baseline}
.dropdown-h .dropdown-fig{margin-left:auto;color:var(--muted);font-size:.9rem}
.dropdown-h .dropdown-fig strong{color:var(--ink)}
.dropdown-h .chev{color:var(--muted);font-size:.9rem}
.dropdown.open>.dropdown-h{border-bottom:1px solid var(--line)}
.note{padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.note.bad{border-color:var(--bad)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-weight:600;margin-bottom:2px}

.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{flex:1 1 170px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 1.55rem/1.2 var(--display)}
.stat.bad .v{color:var(--bad)}

.btn{font:500 .9rem var(--body);background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:var(--r);padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted);opacity:1}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.x{padding:2px 8px;font-size:1rem;line-height:1.2}
.btn[disabled]{opacity:.5;cursor:default}
.confirm{display:inline-flex;gap:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.band :focus-visible{outline-color:var(--on-band)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;align-items:end}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f > span{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f.wide{grid-column:span 2}
.f.full{grid-column:1/-1}
.form .go{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:420px){ .f.wide{grid-column:1/-1} }

.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,var(--surface))}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.pill.neutral{color:var(--muted);border-color:var(--line)}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 14%,var(--surface))}
.startrow{margin-top:5px}

.items{list-style:none;margin:0;padding:0}
.item{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.item-main{flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
.item-amt{text-align:right;display:flex;flex-direction:column}
.amt{font-weight:600}
.item-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item-act select{width:auto}
.item.editing{display:block;background:var(--sunk)}
.item.crew-sub{cursor:pointer}
.item.crew-sub:hover{background:var(--sunk)}
.item.crew-sub .chev{color:var(--muted);font-size:.85em}
.item.crew-sub.open{background:var(--sunk)}
.rem-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start;margin-top:16px}
.rem-add{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.rem-add .f{flex:1 1 auto;margin:0}
.rem-add .f.when{flex:0 1 190px}
.rem-add .go{flex:0 0 auto}
.rem .rem-check{flex:0 0 auto;display:flex;align-items:center}
.rem .rem-check input{width:20px;height:20px}
.rem.rem-done .item-main{text-decoration:line-through;color:var(--muted)}
.rem.rem-top{background:var(--sunk)}
.rem.rem-top .item-main{font-weight:600}
.rem.rem-top .item-main::before{content:"★ ";color:var(--accent,#c89b3c)}
.rem-sep{list-style:none;padding:8px 16px;border-top:1px solid var(--line);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.maplink{white-space:nowrap;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;font-size:.82em}
.maplink:hover{background:var(--sunk)}
.dw-weeks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 16px}
.dw-weeks .sub{flex:1 1 100%;margin-bottom:2px}
/* Dayworks: Job → Month → Week → sheets, nested dropdowns */
.dw-months{border-top:1px solid var(--line)}
.subdrop{border-top:1px solid var(--line)}
.dw-months>.subdrop:first-child{border-top:0}
.subdrop>.dropdown-h .dropdown-t{font:600 .98rem var(--display)}
.subdrop.month>.dropdown-h{background:color-mix(in srgb,var(--sunk) 35%,transparent)}
.subdrop.week>.dropdown-h{padding-left:30px}
.subdrop.week>.dropdown-h .dropdown-t{font-size:.9rem}
.subdrop.week>.dropdown-h .dropdown-t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:2px;align-self:center}
.subdrop.week .items .item{padding-left:30px}
.subdrop.week .dw-weeks{padding-left:30px}
.dwpick-row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.dw-months>.subdrop:first-child .dwpick-row:first-child,.dwpick-row:first-child{border-top:0}
.dwpick-row.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.dwpick-cb{display:flex;align-items:center;padding:0 12px 0 16px;cursor:pointer}
.dwpick-cb input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.dwpick-row>.subdrop{flex:1 1 auto;border-top:0}
.dwinv{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.dwinv input{width:17px;height:17px;accent-color:#2e9e5b;cursor:pointer}
.dwinv.on{color:#2e9e5b;font-weight:600}
.dwinv.wk{font-size:.88rem;font-weight:600}
.inv-badge{display:inline-block;background:#2e9e5b;color:#fff;border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:600;vertical-align:middle}
.addr-sug{position:absolute;z-index:3000;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);overflow:hidden;max-height:280px;overflow-y:auto}
.addr-item{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}
.addr-item:last-child{border-bottom:0}
.addr-item:hover,.addr-item:focus{background:var(--sunk)}
.addr-none{padding:10px 12px;color:var(--muted);font-size:.9rem}
.crew-detail{padding:0;border-top:0;background:var(--sunk)}
.crew-detail tr.off td{color:var(--muted)}
button.link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
button.link:hover{text-decoration-color:var(--ink)}

.scroll-x{overflow-x:auto;border-top:1px solid var(--line)}
table.grid{border-collapse:collapse;width:100%}
.grid th,.grid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.grid thead th{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.grid th.n,.grid td.n{text-align:right}
.grid tbody tr:last-child td,.grid tfoot tr:last-child td,.grid tfoot tr:last-child th{border-bottom:0}
.grid input,.grid select{padding:5px 7px}
.grid tfoot tr.tot th,.grid tfoot tr.tot td{border-top:2px solid var(--line);font-weight:700;font-family:var(--display);white-space:nowrap}
.ts{min-width:760px}
.ts .hr{width:3.4em;text-align:center}
.ts td.we,.ts th.we{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.ts .job select{min-width:170px}
.ts .job .loc{min-width:160px}
.ts tr.emp th{background:var(--sunk);font-weight:600;padding:8px}
.ts tr.emp td{background:var(--sunk);font-weight:600}
.ts tr.emp .sub{font-weight:400;margin-left:8px}
.ts tr.emp .btn{margin-left:10px}
.ts tfoot th,.ts tfoot td{font-weight:600;border-top:2px solid var(--line)}
.ts td.day,.ts th.day{text-align:center}
.cts{min-width:0;width:100%}
.cts .job{width:100%}
.cts .job select{min-width:0;width:100%}
.cts .n{width:5.5em}
.cts .dow{text-align:left;white-space:nowrap;font-weight:600}
.cts .dow.we{color:var(--muted)}
.cts .dow .dnum{color:var(--muted);font-weight:400;margin-left:6px}
.cts td.x{width:2.2em;text-align:center;padding-left:0}
.cts td.x .btn{padding:2px 8px;line-height:1}
.cts tr.cday.more td,.cts tr.cday.more th{border-top:0}
.cts tr.addrow td{border-top:0;padding-top:2px;padding-bottom:10px}
.cts tr.addrow .btn{font-size:.8rem}
.lines{min-width:640px}
.lines .q{width:5.5em;text-align:right} .lines .u{width:5em} .lines .rt{width:7em;text-align:right}
.rc{min-width:680px}
.rc .cd{width:7em} .rc .u{width:5.5em} .rc .rt{width:7em;text-align:right}
.rc tr.cat th{background:var(--sunk);font-family:var(--display);font-weight:600}
.tm{min-width:560px}
.tm .rt{width:7em;text-align:right}
.totals{display:flex;flex-direction:column;gap:6px;margin-left:auto;max-width:360px}
.totals div{display:flex;justify-content:space-between;gap:16px;align-items:center}
.totals .grand{font:600 1.15rem var(--display);border-top:2px solid var(--line);padding-top:8px}
.totals input{width:5em;text-align:right;padding:4px 6px}
.listfoot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 16px;border-top:2px solid var(--line);font:600 1.05rem var(--display)}
.listfoot strong{font-size:1.15rem}
.listfoot .sub{font-weight:400}
.item.quoted{background:#eef7f1;box-shadow:inset 3px 0 0 #57d38a}
.item.unpriced{background:#fdeeee;box-shadow:inset 3px 0 0 #e05656}
[data-droptender].dragover{outline:2px dashed #57d38a;outline-offset:-6px;background:#eef7f1}
.sched.gantt{table-layout:fixed;min-width:620px;border-collapse:separate;border-spacing:0}
.sched.gantt th,.sched.gantt td{border:1px solid var(--line)}
.sched.gantt th.tcol,.sched.gantt td.tcol{width:74px;min-width:74px;text-align:right;white-space:nowrap;font-weight:600;color:var(--muted);vertical-align:middle;font-size:.78rem;padding:4px 8px;background:var(--surface)}
.sched.gantt thead th{padding:7px 4px;text-align:center;background:var(--accent);color:var(--on-accent);border-color:color-mix(in srgb,var(--accent) 70%,#000);font-size:.84rem}
.sched.gantt thead th .sub{display:block;font-weight:500;font-size:.72rem;color:color-mix(in srgb,var(--on-accent) 80%,transparent)}
.sched.gantt thead th.tcol{background:var(--surface);color:var(--muted);border-color:var(--line)}
.sched.gantt thead th.today{background:var(--good);border-color:color-mix(in srgb,var(--good) 70%,#000)}
.sched.gantt td.jcell{padding:2px;height:44px;vertical-align:middle;position:relative;overflow:visible}
.sched.gantt td.jcell.we{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
.sched.gantt td.jcell.today{background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.sched.gantt thead th:not(.tcol){padding:0}
.sched.gantt .dayhead{all:unset;box-sizing:border-box;display:block;width:100%;padding:7px 4px;cursor:pointer;text-align:center;font-weight:700}
.sched.gantt .dayhead:hover,.sched.gantt .dayhead:focus-visible{background:color-mix(in srgb,#fff 14%,transparent)}
.sched.gantt thead th.picked{box-shadow:inset 0 -4px 0 var(--warn)}
.sched.gantt tr:not(.jobrow) td[data-sday]{cursor:pointer}
.sdpanel{border:2px solid var(--accent)}
.mdov{position:fixed;inset:0;z-index:40;background:rgba(15,24,34,.55);display:flex;align-items:flex-start;justify-content:center;padding:8vh 14px 14px;overflow:auto}
.mdbox{width:100%;max-width:560px;margin:0;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.mdbox textarea{width:100%;min-height:150px;font:inherit}
.meetnotes{margin-top:6px;padding:8px 10px;border-left:3px solid var(--info);background:color-mix(in srgb,var(--info) 10%,var(--surface));border-radius:4px;font-size:.88rem;white-space:pre-wrap}
.meetnotes b{display:block;font-size:.72rem;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.sdpanel .panel-h .week h3{margin:0 4px}
.sdsec{font-size:.72rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:12px 16px 2px}
.sdot{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-top:4px}
.sched.gantt tr.jobrow{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.sched.gantt tr.jobrow.dragging{cursor:grabbing}
.sched.gantt tr.jobrow.dragging .jseg{opacity:.85}
.jseg{background:var(--c);height:40px;line-height:40px;white-space:nowrap;overflow:hidden;margin:0 -1px;position:relative;z-index:1;border-radius:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,#000 14%,transparent)}
.jseg.l{border-radius:3px 0 0 3px;z-index:2}
.jseg.r{border-radius:0 3px 3px 0}
.jseg.l.r{border-radius:3px}
.jlabel{color:#fff;font-size:.82rem;font-weight:600;padding:0 8px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmark{background:var(--c);color:#fff;border-radius:3px;padding:5px 7px;margin:2px 3px;font-size:.75rem;line-height:1.2;box-shadow:inset 0 0 0 1px color-mix(in srgb,#000 14%,transparent)}
.cform{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.thanks{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-top:1px solid var(--line);color:var(--ink)}
.sched.gantt td.vcell{vertical-align:top;padding:3px}
.tev{background:var(--c);color:#fff;border-radius:3px;padding:5px 7px;margin:2px 0;font-size:.76rem;line-height:1.18;box-shadow:inset 0 0 0 1px color-mix(in srgb,#000 14%,transparent)}
.tev strong{font-weight:600;display:block}
.tev .tsub{color:rgba(255,255,255,.85);display:block;font-size:.7rem}
.slegend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.skey{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.skey i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.week{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.week h2{min-width:0}
.kv{display:flex;flex-wrap:wrap;gap:6px 22px}
.kv div{display:flex;gap:8px;align-items:baseline}
.steps{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:6px}
.steps li.done{color:var(--muted);text-decoration:line-through}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.filebtn{position:relative;display:inline-block}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:9px 16px;border-radius:var(--r);max-width:calc(100% - 32px);font-size:.9rem;z-index:10}
</style>

<header class="band">
  <div class="wrap band-in">
    <img src="assets/logo.png" alt="" style="height:36px;width:36px;border-radius:50%;object-fit:cover;align-self:center;margin-right:4px">
    <span class="mark">D&amp;C</span>
    <span class="strap">Groundworks &amp; Civils · Site Office</span>
    <span id="who" style="margin-left:auto;color:var(--on-band);font-weight:600;font-size:.9rem"></span>
    <span class="sync" id="sync" style="margin-left:14px">Connecting…</span>
    <button type="button" class="btn ghost sm" id="hdr-out" style="display:none;margin-left:12px;border-color:var(--band-muted);color:var(--on-band)">Sign out</button>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main class="wrap" id="view"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="dayworks-config.js"></script>
<script src="dayworks-ratelists.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const view=$('view'), tabsEl=$('tabs');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0;};
const sum=a=>(a||[]).reduce((t,x)=>t+num(x),0);
const gbp=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
const gbp0=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0});
const money=n=>gbp.format(n||0), money0=n=>gbp0.format(Math.round(n||0));
const hrs=n=>String(Math.round(n*100)/100);
const nf=v=>v===''||v==null?'':String(v);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const addDays=(s,n)=>{const d=parse(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);};
const mondayOf=s=>addDays(s,-((parse(s).getUTCDay()+6)%7));
const dayDiff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=(s,yr)=>{if(!s)return '—';const d=parse(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]+(yr?' '+d.getUTCFullYear():'');};
const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''));
const pill=(k,t)=>`<span class="pill ${k}">${esc(t)}</span>`;
const size=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

const TABS=[['overview','Overview'],['schedule','Schedule'],['reminders','Reminders'],['timesheets','Timesheets'],['dayworks','Dayworks'],['quotes','Enquiries'],['projects','Projects'],['invoices','Invoices'],['rates','Rate card'],['team','Team'],['crew','Holidays']];
const COLS=['employees','projects','quotes','invoices','rates','timesheets','crew_hours','reminders','holidays','lead_reminders','events','dw_invoiced'];
const S={};COLS.forEach(c=>S[c]={});
const loaded={};
let db=null, assets=null, mode='connecting';
/* re-pull the latest when the app is reopened/brought to the foreground —
   iOS freezes Home-Screen web apps in the background and drops the live feed,
   so without this the lads' newly submitted hours look stale until a manual reload */
let fgRefresh=null, fgLast=0;
function foregroundSync(){
  if(document.visibilityState==='hidden')return;
  const now=Date.now();if(now-fgLast<1500)return;fgLast=now;
  if(typeof fgRefresh==='function')fgRefresh();
}
document.addEventListener('visibilitychange',foregroundSync);
window.addEventListener('pageshow',foregroundSync);
window.addEventListener('focus',foregroundSync);
let PEOPLE=[];
const ui={tab:'overview',week:mondayOf(todayISO()),schedWeek:mondayOf(todayISO()),project:null,edit:null,confirm:null,drafts:{},rateFilter:'',quoteFilter:'open',busy:'',focusNext:null,skipKeep:null,crewOpen:null,xlink:null,ovOpen:{attention:true,diary:true,timeoff:false,projects:false,setup:true},tsGridOpen:false};
const list=c=>Object.entries(S[c]).map(([id,d])=>({...d,id}));

/* ---------- store ---------- */
function merge(a,b){const o={...a};for(const k in b){const v=b[k],w=a?a[k]:undefined;o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&w&&typeof w==='object'&&!Array.isArray(w))?merge(w,v):v;}return o;}
function applyLocal(col,id,op,data){const m={...S[col]};if(op==='delete')delete m[id];else if(op==='set')m[id]=data;else m[id]=merge(m[id]||{},data);S[col]=m;}
const chains={};
function write(col,id,op,data){
  applyLocal(col,id,op,data);schedule();
  if(!db)return Promise.resolve(true);
  const key=col+'/'+id;
  const run=async()=>{
    const ref=db.collection(col).doc(id);
    const go=()=>op==='set'?ref.set(data):op==='update'?ref.update(data):ref.delete();
    try{await go();return true;}
    catch(e1){
      let e=e1;
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,500+Math.random()*700));try{await go();return true;}catch(e2){e=e2;}}
      fail(e,col);return false;
    }
  };
  return chains[key]=(chains[key]||Promise.resolve()).then(run);
}
function fail(e,col){
  const c=e&&e.code;
  toast(c==='invalid_argument'?'That change was not saved. You may have view-only access to this page.':c==='quota_exceeded'?'Storage for this page is full. Delete old records to make room.':'That change could not be saved. Check your connection and try again.');
  if(db)db.collection(col).limit(1000).get().then(s=>take(col,s)).catch(()=>{});
}
function take(col,snap){const m={};snap.docs.forEach(d=>{m[d.id]=d.data();});S[col]=m;loaded[col]=true;if(mode==='connecting'&&COLS.every(c=>loaded[c]))mode='live';schedule();}
function subscribe(){COLS.forEach(c=>{db.collection(c).limit(1000).onSnapshot(s=>take(c,s),()=>{db=null;mode='local';schedule();});});}

/* ---------- derived ---------- */
const H=r=>Array.from({length:7},(_,d)=>num((r&&r.h||[])[d]));
const rowsOf=(wk,emp)=>JSON.parse(JSON.stringify(((S.timesheets[wk]||{}).sheets||{})[emp]||[]));
const blankRow=()=>({p:'',h:[0,0,0,0,0,0,0]});
function saveSheet(wk,emp,rows){
  if(S.timesheets[wk])write('timesheets',wk,'update',{sheets:{[emp]:rows}});
  else write('timesheets',wk,'set',{week:wk,sheets:{[emp]:rows}});
}
function weekTotals(wk){
  const T={hours:0,cost:0,byDay:[0,0,0,0,0,0,0],byProject:{},byEmp:{}};
  const sheets=(S.timesheets[wk]||{}).sheets||{};
  for(const emp in sheets){const rate=num((S.employees[emp]||{}).rate);
    for(const r of sheets[emp]||[]){const h=H(r),t=sum(h);if(!t)continue;
      T.hours+=t;T.cost+=t*rate;h.forEach((x,d)=>T.byDay[d]+=x);
      const bp=T.byProject[r.p||'']||(T.byProject[r.p||'']={h:0,cost:0});bp.h+=t;bp.cost+=t*rate;
      const be=T.byEmp[emp]||(T.byEmp[emp]={h:0,cost:0});be.h+=t;be.cost+=t*rate;}}
  return T;
}
function hoursByProject(){const out={};for(const wk in S.timesheets){const bp=weekTotals(wk).byProject;for(const p in bp){const o=out[p]||(out[p]={h:0,cost:0});o.h+=bp[p].h;o.cost+=bp[p].cost;}}return out;}
// Combined hours + labour for a week: the lads' own submissions (crew_hours, costed at
// each man's rate from the Team list, matched by name) PLUS any director-grid rows for
// people who didn't self-submit (so nobody is counted twice). Used for the Overview
// headline. The Timesheets grid keeps its own grid-only totals from weekTotals().
function weekLabour(wk){
  const emps=S.employees||{}, rateByName={};
  for(const id in emps){const e=emps[id]||{};if(e.name)rateByName[e.name.trim().toLowerCase()]=num(e.rate);}
  let hours=0,cost=0;const submitted=new Set();
  for(const key in (S.crew_hours||{})){const x=S.crew_hours[key]||{};if(x.week!==wk)continue;
    const nm=(x.name||'').trim(), rate=rateByName[nm.toLowerCase()]||0;let t=0;
    if(x.entries&&x.entries.length)t=x.entries.reduce((a,e)=>a+num(e.h),0);
    else if(x.days&&x.days.length)t=x.days.reduce((a,d)=>a+num(d.h),0);
    else if(x.rows&&x.rows.length)t=x.rows.reduce((a,r)=>a+sum((r.h||[]).map(num)),0);
    if(!t)continue;hours+=t;cost+=t*rate;if(nm)submitted.add(nm.toLowerCase());}
  const sheets=(S.timesheets[wk]||{}).sheets||{};
  for(const emp in sheets){const e=emps[emp]||{};if(e.name&&submitted.has(e.name.trim().toLowerCase()))continue;const rate=num(e.rate);
    for(const r of sheets[emp]||[]){const t=sum(H(r));if(!t)continue;hours+=t;cost+=t*rate;}}
  return {hours,cost};
}
function projTotals(p){const sub=(p.lines||[]).reduce((t,l)=>t+num(l.qty)*num(l.rate),0);const mk=sub*num(p.markup)/100;return {sub,mk,total:sub+mk};}
const termsOf=i=>i.terms===''||i.terms==null?30:num(i.terms);
const gross=i=>num(i.net)*(i.vat==='std'?1.2:1);
function invState(i,today){if(i.paid)return 'paid';if(i.sent)return addDays(i.sent,termsOf(i))<today?'overdue':'awaiting';return i.sendBy&&i.sendBy<today?'late':'tosend';}
function invPill(i,st,today){
  const due=i.sent?addDays(i.sent,termsOf(i)):'';
  if(st==='paid')return pill('good','Paid '+fmtD(i.paid));
  if(st==='overdue')return pill('bad','Overdue '+dayDiff(today,due)+' days');
  if(st==='awaiting')return pill('neutral','Sent · due '+fmtD(due));
  if(st==='late')return pill('bad','Send now · was due '+fmtD(i.sendBy));
  return pill('warn',i.sendBy?'Send by '+fmtD(i.sendBy):'To send');
}
const projName=id=>(S.projects[id]||{}).name||'';
const quoteValue=q=>{const p=q.projectId&&S.projects[q.projectId];const t=p?(num(p.tender)||projTotals(p).total):0;return t>0?t:num(q.value);};
const VAT={std:'20% VAT',drc:'Reverse charge',zero:'Zero rated'};
const QSTATUS=['New','Visit booked','Pricing','Quoted','Won','Lost'];
const toPrice=q=>q.status==='New'||q.status==='Visit booked'||q.status==='Pricing';
// still needs a price = in a pricing stage AND no figure entered yet (matches the red enquiry row)
const needsPrice=q=>toPrice(q)&&!quoteValue(q);
const isOpenQ=q=>q.status!=='Won'&&q.status!=='Lost';
const visitDue=q=>q.visitDate&&!q.visitDone&&isOpenQ(q);
// A site visit can hang off an enquiry (quote) OR an existing job (project). Both store the same
// visit* fields; asVisit normalises either into one quote-style shape so the diary, schedule and
// calendar export treat them identically. vkind 'q' = enquiry, 'p' = job.
const asVisit=(vkind,r)=>({vkind,id:r.id,
  client:(vkind==='q'?r.client:r.name)||'—',
  job:(vkind==='q'?r.job:r.client)||'',
  site:r.site||'',phone:r.phone||'',
  visitDate:r.visitDate,visitTime:r.visitTime||'',visitBy:r.visitBy||'',visitNotes:r.visitNotes||'',visitDone:!!r.visitDone});
// Open, not-yet-done visits across both enquiries and jobs — the diary/attention source.
const allVisits=()=>list('quotes').filter(visitDue).map(q=>asVisit('q',q))
  .concat(list('projects').filter(p=>p.visitDate&&!p.visitDone&&p.status!=='Complete').map(p=>asVisit('p',p)));
const dayLabel=(s,today)=>{const d=dayDiff(s,today);return d===0?'Today':d===1?'Tomorrow':DOW[(parse(s).getUTCDay()+6)%7]+' '+fmtD(s);};
const mapLink=site=>site?` <a class="maplink" href="https://maps.apple.com/?q=${encodeURIComponent(site)}" target="_blank" rel="noopener" aria-label="Open address in Maps">Map ↗</a>`:'';
const SOURCES=['Phone call','Text message','WhatsApp','Email','Website','Referral','Repeat client','Main contractor tender','Social media','Other'];
const WORK=['Foundations & footings','RC slabs & ground beams','Groundworks (general)','Drainage, foul & surface water','Sewer connections','Soakaways & attenuation','Bulk excavation & reduced level dig','Basement & dig','Site clearance & muck away','Demolition','Driveways & paving','Concrete yards & hardstanding','Roads, kerbs & footpaths','External works & landscaping','Retaining walls','Service trenches & ducting','Piling mat & attendance','Block & beam flooring','Agricultural buildings','Utilities & street works','Extension groundworks','Other'];
const ROLES=['Groundworker','Ganger','Machine driver (360)','Dumper driver','Roller driver','Steel fixer','Pipelayer','Labourer','Site manager','Director'];
const PSTATUS=['Pricing','Ready to start','Live','Complete'];
// Fixed gangs the office runs; a job is assigned to one and the schedule colours its bar by gang.
// Reassign a job to a different gang any time by changing its gang on the project.
const GANGS=[{k:'g1',name:'Gang 1 - Chris',c:'--gang1'},{k:'g2',name:'Gang 2 - Matt',c:'--gang2'},{k:'g3',name:'Gang 3 - Dan',c:'--gang3'},{k:'g4',name:'Gang 4',c:'--gang4'}];
const gangOf=k=>GANGS.find(g=>g.k===k);
const projPill=s=>s==='Live'?'good':s==='Ready to start'?'info':s==='Complete'?'neutral':'warn';
const holSpan=h=>h.from===h.to?fmtD(h.from):fmtD(h.from)+' – '+fmtD(h.to);
const evEnd=e=>(e.to&&e.to>=e.from)?e.to:e.from;
/* Reminder due times are plain local 'YYYY-MM-DDTHH:MM' strings, so they sort and compare as text. */
const nowLocal=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());};
const remDuePill=w=>{const n=nowLocal(),day=w.slice(0,10),t=w.slice(11,16);
  return pill(w<=n?'bad':day===n.slice(0,10)?'warn':'info',(w<=n?'Due ':'')+(day===n.slice(0,10)?'Today':fmtD(day))+' '+t);};
const evLabel=e=>(e.time?e.time+' · ':'')+(e.title||'Diary')+(e.client?' · '+e.client:'')+(e.who?' · '+e.who:'');
const telHref=p=>'tel:'+String(p||'').replace(/[^+0-9]/g,'');
/* What's on for one day — derived live from approved holidays, booked site visits and
   project start dates, so approving a holiday puts the lad straight into that day. */
function schedFor(day){
  const hols=list('holidays').filter(h=>h.status==='approved'&&h.from&&h.to&&h.from<=day&&day<=h.to);
  const visits=list('quotes').filter(q=>q.visitDate===day);
  const dues=list('quotes').filter(q=>q.due===day&&needsPrice(q));
  const starts=list('projects').filter(p=>p.startDate===day);
  return {hols,visits,dues,starts,count:hols.length+visits.length+dues.length+starts.length};
}

/* ---------- form helpers ---------- */
const dv=(form,name,def)=>{const d=ui.drafts[form];return d&&name in d?d[name]:(def??'');};
const fld=(form,name,label,val,o={})=>`<label class="f ${o.cls||''}"><span>${label}</span><input id="${form}-${name}" name="${name}" type="${o.type||'text'}" value="${esc(dv(form,name,val))}" ${o.attrs||''}></label>`;
const sel=(form,name,label,val,opts,o={})=>{const v=dv(form,name,val);return `<label class="f ${o.cls||''}"><span>${label}</span><select id="${form}-${name}" name="${name}">${opts.map(([k,l])=>`<option value="${esc(k)}"${String(k)===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select></label>`;};
const area=(form,name,label,val)=>`<label class="f full"><span>${label}</span><textarea id="${form}-${name}" name="${name}">${esc(dv(form,name,val))}</textarea></label>`;
const del=(key,label)=>ui.confirm===key
  ?`<span class="confirm"><button type="button" class="btn sm danger" id="cf-${key}" data-act="del" data-key="${key}">Confirm</button><button type="button" class="btn sm ghost" data-act="cancel">Keep</button></span>`
  :`<button type="button" class="btn sm ghost${label==='×'?' x':''}" id="ask-${key}" data-act="ask" data-key="${key}" aria-label="Delete">${label||'Delete'}</button>`;
const empty=(title,text,btn)=>`<div class="empty"><strong>${title}</strong>${text}${btn?`<div style="margin-top:10px">${btn}</div>`:''}</div>`;
const goBtn=(tab,label)=>`<button type="button" class="btn sm" data-act="tab" data-tab="${tab}">${label}</button>`;
/* Collapsible overview panel — the header line stays readable when it's shut. */
const dropSec=(key,title,fig,body)=>{const o=!!ui.ovOpen[key];
  return `<section class="panel dropdown${o?' open':''}"><button type="button" class="dropdown-h" data-act="ovSec" data-k="${key}" aria-expanded="${o}"><span class="dropdown-t">${title}</span>${fig?`<span class="dropdown-fig">${fig}</span>`:''}<span class="chev">${o?'▴':'▾'}</span></button>${o?body:''}</section>`;};

/* ---------- views ---------- */
const views={};

views.overview=()=>{
  const today=todayISO(), wk=mondayOf(today), W=weekTotals(wk), WL=weekLabour(wk);
  const quotes=list('quotes'), open=quotes.filter(toPrice), toQuote=open.filter(q=>!quoteValue(q)), sentQ=quotes.filter(q=>q.status==='Quoted');
  const visits=allVisits().sort((a,b)=>(a.visitDate+(a.visitTime||'')).localeCompare(b.visitDate+(b.visitTime||'')));
  const visits7=visits.filter(q=>{const d=dayDiff(q.visitDate,today);return d>=0&&d<=7;});
  const inv=list('invoices').map(i=>({...i,st:invState(i,today)}));
  const g=a=>a.reduce((t,i)=>t+gross(i),0);
  const toSend=inv.filter(i=>i.st==='tosend'||i.st==='late'), awaiting=inv.filter(i=>i.st==='awaiting'||i.st==='overdue'), overdue=inv.filter(i=>i.st==='overdue');
  const nextDue=toQuote.filter(q=>q.due).sort((a,b)=>a.due.localeCompare(b.due))[0];
  const stats=`<div class="stats">
    <div class="stat"><span class="k">Hours this week</span><span class="v">${hrs(WL.hours)}</span><span class="sub">${money(WL.cost)} labour · w/c ${fmtD(wk)}</span></div>
    <div class="stat"><span class="k">Enquiries to price</span><span class="v">${toQuote.length}</span><span class="sub">${nextDue?'Next due '+fmtD(nextDue.due):'None with a deadline'}${sentQ.length?' · '+sentQ.length+' quoted':''}</span></div>
    <div class="stat"><span class="k">Site visits, next 7 days</span><span class="v">${visits7.length}</span><span class="sub">${visits7.length?'Next '+dayLabel(visits7[0].visitDate,today)+(visits7[0].visitTime?' '+visits7[0].visitTime:''):'None booked'}</span></div>
    <div class="stat"><span class="k">Invoices to send</span><span class="v">${money0(g(toSend))}</span><span class="sub">${toSend.length} invoice${toSend.length===1?'':'s'}, inc VAT</span></div>
    <div class="stat"><span class="k">Awaiting payment</span><span class="v">${money0(g(awaiting))}</span><span class="sub">${awaiting.length} sent, inc VAT</span></div>
    <div class="stat${overdue.length?' bad':''}"><span class="k">Overdue</span><span class="v">${money0(g(overdue))}</span><span class="sub">${overdue.length?overdue.length+' past terms':'Nothing past terms'}</span></div>
  </div>`;
  const qByProj={};quotes.forEach(q=>{if(q.projectId)qByProj[q.projectId]=q;});
  const att=[];
  quotes.filter(q=>q.status==='New').forEach(q=>att.push([dayDiff(q.received||today,today),'warn','New enquiry',`${q.client} · ${q.job}${q.phone?' · '+q.phone:''}`,'quotes']));
  visits.filter(v=>v.visitDate<today).forEach(v=>att.push([dayDiff(v.visitDate,today),'bad','Visit not marked done',`${v.client} · ${fmtD(v.visitDate)}`,v.vkind==='p'?'projects':'quotes',v.id,v.vkind]));
  open.filter(q=>q.status!=='New'&&!quoteValue(q)&&q.due&&dayDiff(q.due,today)<=7).forEach(q=>{const d=dayDiff(q.due,today);att.push([d,d<0?'bad':'warn',d<0?'Quote overdue':'Quote due '+(d===0?'today':'in '+d+'d'),`${q.client} · ${q.job}`,'quotes']);});
  inv.filter(i=>i.st==='late').forEach(i=>att.push([dayDiff(i.sendBy,today),'bad','Invoice not sent',`${i.number||'No number'} · ${i.client} · ${money(num(i.net))} net`,'invoices']));
  overdue.forEach(i=>{const d=dayDiff(addDays(i.sent,termsOf(i)),today);att.push([d,'bad','Payment overdue '+(-d)+'d',`${i.number||'No number'} · ${i.client} · ${money(gross(i))}`,'invoices']);});
  // A job's schedule has run out (end date reached) but nothing's been invoiced against it yet —
  // remind to raise the invoice. Skips pricing stubs (an enquiry still being priced) and clears
  // once any invoice is linked to the project or it's marked Complete.
  const xeroLinked=pid=>XERO.rows.some(x=>x.project_id===pid);
  list('projects').filter(p=>{if(p.status==='Complete'||!p.endDate||p.endDate>today)return false;const q=qByProj[p.id];if(q&&q.status!=='Won')return false;return !inv.some(i=>i.projectId===p.id)&&!xeroLinked(p.id);}).forEach(p=>{const d=dayDiff(p.endDate,today);att.push([d,d<-3?'bad':'warn','Invoice due — job finished',`${p.name}${p.client?' · '+p.client:''} · finished ${fmtD(p.endDate)}`,'invoices',null,null,p.client||p.name]);});
  list('reminders').filter(r=>r.when&&!r.done).forEach(r=>{const d=dayDiff(r.when.slice(0,10),today);if(d<=0)att.push([d,'warn','Reminder · '+(r.owner==='chris'?'Chris':'Dan'),`${r.text} · ${d===0?'today':fmtD(r.when.slice(0,10))} ${r.when.slice(11,16)}`,'reminders']);});
  att.sort((a,b)=>a[0]-b[0]);

  const bookForm=(openEnq.length||openJobs.length)

  const projBody=live.length?`<div class="scroll-x" id="sx-ov"><table class="grid" style="min-width:620px"><thead><tr><th>Project</th><th>Stage</th><th class="n">Priced</th><th class="n">Invoiced</th><th class="n">Labour to date</th><th class="n">Hours</th></tr></thead><tbody>${live.map(p=>{const h=hb[p.id]||{h:0,cost:0};return `<tr><td><button type="button" class="link" data-act="openProject" data-id="${p.id}">${esc(p.name)}</button><div class="sub">${esc(p.client||'')}</div></td><td>${pill(projPill(p.status),p.status||'Pricing')}${p.status==='Ready to start'?`<div class="startrow">${p.startDate?pill('good','Starts '+fmtD(p.startDate)):pill('warn','Set start date')}</div>`:''}</td><td class="n">${p.tender?money(num(p.tender)):money(projTotals(p).total)}</td><td class="n">${money(invBy[p.id]||0)}</td><td class="n">${money(h.cost)}</td><td class="n">${hrs(h.h)}</td></tr>`;}).join('')}</tbody><tfoot><tr class="tot"><th>Total</th><td></td><td class="n">${money(ovTot.priced)}</td><td class="n">${money(ovTot.inv)}</td><td class="n">${money(ovTot.cost)}</td><td class="n">${hrs(ovTot.h)}</td></tr></tfoot></table></div><div class="panel-b">${goBtn('projects','All projects')}</div>`:empty('No projects yet','Add a project to price it off the rate card and attach its drawings.',goBtn('projects','Add a project'));

views.schedule=()=>{
  const today=todayISO(), wk=ui.schedWeek, thisWk=mondayOf(today), wkEnd=addDays(wk,6);

  const days=[];for(let i=0;i<7;i++){const day=addDays(wk,i);days.push({day,i,we:i>4,isT:day===today});}
  const cls=d=>`day${d.we?' we':''}${d.isT?' today':''}`;
  const col=iso=>Math.max(0,Math.min(6,dayDiff(iso,wk)));
  const th=`<th class="tcol"></th>`+days.map(d=>`<th class="${cls(d)}${ui.schedDay===d.day?' picked':''}"><button type="button" class="dayhead" data-act="schedDay" data-day="${d.day}" aria-label="See everything on ${DOW[d.i]} ${fmtD(d.day)}">${DOW[d.i]}<span class="sub"> ${parse(d.day).getUTCDate()} ${MON[parse(d.day).getUTCMonth()]}</span></button></th>`).join('');
  // A horizontal bar spanning the days it covers, drawn across 7 individual day cells so every
  // day stays a drag target. jid makes the row a draggable job; otherwise it's a static span (holiday).

    opts=opts||{};const cs=col(s<wk?wk:s), ce=col(e>wkEnd?wkEnd:e), contL=s<wk, contR=e>wkEnd;
    let cells=`<th class="tcol">${label||''}</th>`;
    for(let i=0;i<7;i++){const inSpan=i>=cs&&i<=ce;
      // Repeat the label in every day the bar covers so each day reads on its own, not just the colour.
      const seg=inSpan?`<div class="jseg${i===cs?' l':''}${i===ce?' r':''}" style="--c:var(${colorVar})"><span class="jlabel">${i===cs&&contL?'‹ ':''}${esc(opts.text||'')}${i===ce&&contR?' ›':''}</span></div>`:'';
      cells+=`<td class="jcell ${days[i].we?'we':''}${days[i].isT?' today':''}" data-sday="${days[i].day}"${opts.jid?` data-jday="${i}" data-jid="${esc(opts.jid)}" data-jkind="${opts.kind||'job'}"`:''}>${seg}</td>`;}
    return `<tr class="${opts.rowcls||''}"${opts.jid?` data-jid="${esc(opts.jid)}" data-jkind="${opts.kind||'job'}"`:''}>${cells}</tr>`;
  };
  // Jobs = draggable bars. Any non-complete project with a start date that overlaps this week.
  const jobs=list('projects').filter(p=>p.status!=='Complete'&&p.startDate).map(p=>({p,s:p.startDate,e:(p.endDate&&p.endDate>=p.startDate)?p.endDate:p.startDate})).filter(j=>j.e>=wk&&j.s<=wkEnd).sort((a,b)=>String(a.s).localeCompare(String(b.s))||byName(a.p,b.p));
  const jobRows=jobs.length?jobs.map((j,idx)=>{const g=gangOf(j.p.gang);return spanRow(idx===0?'Jobs':'',j.s,j.e,g?g.c:'--accent',{text:(g?g.name+' · ':'')+j.p.name,jid:j.p.id,rowcls:'jobrow'});}).join(''):`<tr class="jobrow-empty"><th class="tcol">Jobs</th><td colspan="7"><span class="sub" style="padding:6px 10px;display:inline-block">No jobs this week. Set a start date on a project, then drag it across the days here.</span></td></tr>`;
  // Timed site visits — small markers on their day. Booked against an enquiry or a job.
  const schedVisits=list('quotes').filter(q=>q.visitDate).map(q=>asVisit('q',q)).concat(list('projects').filter(p=>p.visitDate).map(p=>asVisit('p',p)));

  const addEv=`<section class="panel"><div class="panel-h"><h3>Add to the schedule</h3><span class="sub">Emergency jobs, meetings, deliveries, plant on hire — anything that isn't a full project. Pick a gang to colour it like a job.</span></div><form class="panel-b form" data-form="event">${fld('event','title','What',"",{attrs:'required placeholder="Emergency — burst main, site meeting…"',cls:'wide'})}${fld('event','client','Name / client','',{attrs:'placeholder="Who you\'re meeting"'})}${fld('event','phone','Phone','',{type:'tel'})}${fld('event','site','Address','',{attrs:'data-addr autocomplete="off" placeholder="Site or meeting address"',cls:'wide'})}${fld('event','from','Date',defDate,{type:'date',attrs:'required'})}${fld('event','to','Until (optional)','',{type:'date'})}${fld('event','time','Time (optional)','',{type:'time'})}${sel('event','gang','Gang (optional)','',[['','No gang — diary item']].concat(GANGS.map(g=>[g.k,g.name])))}${fld('event','who','Who is going (optional)','')}<div class="go"><button class="btn">Add to schedule</button></div></form>${evList}</section>`;
  /* ---- tap-a-day: everything on one day, in full ---- */

      sec("Who's off",dOff.map(h=>li('--muted',`<strong>${esc(h.name||'Crew')}</strong>`,[holSpan(h)+(h.reason?' · '+esc(h.reason):'')])));
    dayPanel=`<section class="panel sdpanel" id="sd-panel"><div class="panel-h"><div class="week"><button type="button" class="btn ghost sm" data-act="schedDayStep" data-d="-1" aria-label="Previous day">‹</button><h3>${dw} ${fmtD(sd,true)}</h3><button type="button" class="btn ghost sm" data-act="schedDayStep" data-d="1" aria-label="Next day">›</button></div><button type="button" class="btn ghost sm" id="sd-close" data-act="schedDay" data-day="">Close</button></div>${body||`<div class="panel-b sub">Nothing booked on this day.</div>`}</section>`;
  }
  return head+`<section class="panel"><div class="panel-h"><h3>The week</h3>${legend}</div><div class="scroll-x" id="sx-sched"><table class="grid sched gantt"><thead><tr>${th}</tr></thead><tbody>${jobRows}${evRows}${holRows}${dueRow}${visitRow}</tbody></table></div><div class="panel-b sub">Tap any day to see everything on it in full. Drag a bar across the days to set how long it runs; tap a job to open it.</div></section>`+dayPanel+addEv+(pend?`<section class="panel"><div class="panel-b">${pill('warn',pend+' holiday request'+(pend>1?'s':'')+' waiting')} ${goBtn('crew','Review in Holidays')}</div></section>`:'');
};

views.timesheets=()=>{
  const wk=ui.week, thisWk=mondayOf(todayISO());
  const sheets=(S.timesheets[wk]||{}).sheets||{};
  const emps=list('employees').filter(e=>e.active!==false||(sheets[e.id]||[]).some(r=>sum(H(r))>0)).sort(byName);
  const projs=list('projects').sort(byName);
  const T=weekTotals(wk);
  const prev=(S.timesheets[addDays(wk,-7)]||{}).sheets||{};
  const canCopy=T.hours===0&&Object.values(prev).some(rs=>(rs||[]).some(r=>sum(H(r))>0));
  const head=`<div class="head"><div class="week"><button type="button" class="btn ghost sm" id="wk-prev" data-act="week" data-d="-7" aria-label="Previous week">‹</button><h2>Week commencing ${fmtD(wk,true)}</h2><button type="button" class="btn ghost sm" id="wk-next" data-act="week" data-d="7" aria-label="Next week">›</button>${wk!==thisWk?`<button type="button" class="btn ghost sm" data-act="week" data-d="0">This week</button>`:''}</div><div class="item-act">${canCopy?`<button type="button" class="btn sm" data-act="copyWeek">Copy last week</button>`:''}</div></div>`;
  if(!emps.length)return head+`<section class="panel">${empty('No one on the team yet','Add your employees and their hourly rates, then enter hours per day against each job here.',goBtn('team','Add your team'))}</section>`;
  const opts=cur=>`<option value="">General / not on a job</option>`+projs.filter(p=>p.status!=='Complete'||p.id===cur).map(p=>`<option value="${p.id}"${p.id===cur?' selected':''}>${esc(p.name)}</option>`).join('');
  const body=emps.map(e=>{
    const saved=sheets[e.id]||[], rows=saved.length?saved:[blankRow()], et=T.byEmp[e.id]||{h:0,cost:0};
    return `<tr class="emp"><th colspan="8" scope="rowgroup">${esc(e.name)}<span class="sub">${esc(e.role||'')}${e.rate?' · '+money(num(e.rate))+'/hr':''}</span><button type="button" class="btn ghost sm" id="tsa-${e.id}" data-act="tsAdd" data-e="${e.id}">+ Job</button></th><td class="n">${hrs(et.h)}</td><td class="n sub">${money(et.cost)}</td></tr>`+
    rows.map((r,i)=>{const h=H(r);return `<tr><td class="job"><select id="tsp-${e.id}-${i}" data-chg="tsp" data-e="${e.id}" data-r="${i}" aria-label="Job, ${esc(e.name)}">${opts(r.p||'')}</select></td>${h.map((x,d)=>`<td class="day${d>4?' we':''}"><input id="ts-${e.id}-${i}-${d}" class="hr" inputmode="decimal" autocomplete="off" value="${x?hrs(x):''}" data-chg="ts" data-e="${e.id}" data-r="${i}" data-d="${d}" aria-label="${DOW[d]} hours, ${esc(e.name)}"></td>`).join('')}<td class="n">${hrs(sum(h))}</td><td class="n">${saved.length?`<button type="button" class="btn ghost sm x" id="tsx-${e.id}-${i}" data-act="tsDel" data-e="${e.id}" data-r="${i}" aria-label="Remove row">×</button>`:''}</td></tr>`;}).join('');
  }).join('');
  const tgo=ui.tsGridOpen;
  const table=`<section class="panel dropdown${tgo?' open':''}"><button type="button" class="dropdown-h" data-act="tsGrid" aria-expanded="${tgo}"><span class="dropdown-t">Hours per day, per job</span><span class="dropdown-fig">${hrs(T.hours)} h · ${money(T.cost)}</span><span class="chev">${tgo?'▴':'▾'}</span></button>${tgo?`<div class="scroll-x" id="sx-ts"><table class="grid ts"><thead><tr><th>Job</th>${DOW.map((d,i)=>`<th class="day${i>4?' we':''}">${d} ${parse(addDays(wk,i)).getUTCDate()}</th>`).join('')}<th class="n">Hours</th><th class="n">Cost</th></tr></thead><tbody>${body}</tbody><tfoot><tr><th>All staff</th>${T.byDay.map((x,d)=>`<td class="day${d>4?' we':''}">${hrs(x)}</td>`).join('')}<td class="n">${hrs(T.hours)}</td><td class="n">${money(T.cost)}</td></tr></tfoot></table></div><div class="panel-b sub">Enter hours here only if you're filling in for a lad. Otherwise the crew submit their own below.</div>`:''}</section>`;
  const bp=Object.entries(T.byProject).sort((a,b)=>b[1].h-a[1].h);
  const byJob=`<section class="panel"><div class="panel-h"><h3>This week by job</h3></div>${bp.length?`<ul class="items">${bp.map(([p,o])=>`<li class="item"><div class="item-main">${esc(projName(p)||'General / not on a job')}</div><div class="item-amt"><span class="amt">${hrs(o.h)} h</span><span class="sub">${money(o.cost)} labour</span></div></li>`).join('')}</ul>`:empty('No hours entered for this week','Type hours into the grid above. Totals by job appear here.')}</section>`;
  const crewNorm=(key,x)=>{let tot=0;const byLoc={};let days=null;
    const add=(loc,h)=>{const t=num(h);if(!t)return;tot+=t;const k=loc||'General / not on a job';byLoc[k]=(byLoc[k]||0)+t;};
    if(x.entries&&x.entries.length){days=x.entries.slice().sort((a,b)=>(+a.d||0)-(+b.d||0)).map(e=>({day:DOW[+e.d||0],date:addDays(wk,+e.d||0),loc:e.loc||'',h:num(e.h)}));x.entries.forEach(e=>add(e.loc,e.h));}
    else if(x.days&&x.days.length){days=x.days.map((d,i)=>({day:DOW[i],date:addDays(wk,i),loc:d.loc||'',h:num(d.h)}));x.days.forEach(d=>add(d.loc,d.h));}
    else if(x.rows&&x.rows.length){x.rows.forEach(r=>{const t=sum((r.h||[]).map(num));if(!t)return;tot+=t;const k=[r.job,r.loc].filter(Boolean).join(' — ')||'General / not on a job';byLoc[k]=(byLoc[k]||0)+t;});}
    return {key,name:x.name||'Crew',tot,byLoc,days};};
  const crewSubs=Object.entries(S.crew_hours||{}).filter(([k,x])=>x&&x.week===wk).map(([k,x])=>crewNorm(k,x)).filter(x=>x.tot>0).sort((a,b)=>a.name.localeCompare(b.name));
  const crewWeek=x=>{
    const doc=S.crew_hours[x.key]||{};
    // Modern submissions store an `entries` array — those are editable here. Older
    // days/rows-shaped docs stay read-only (rare; only old weeks).
    if(!(doc.entries&&Array.isArray(doc.entries))){
      let inner;if(x.days){const rows=x.days.map(d=>`<tr${d.h?'':' class="off"'}><td>${d.day} ${parse(d.date).getUTCDate()} ${MON[parse(d.date).getUTCMonth()]}</td><td>${d.loc?esc(d.loc):'<span class="sub">—</span>'}</td><td class="n">${d.h?hrs(d.h)+' h':'<span class="sub">—</span>'}</td></tr>`).join('');
        inner=`<table class="grid" style="min-width:0"><thead><tr><th>Day</th><th>Where</th><th class="n">Hours</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="2">Total</th><td class="n">${hrs(x.tot)} h</td></tr></tfoot></table>`;}
      else{inner='<div class="sub">'+Object.entries(x.byLoc).map(([j,h])=>esc(j)+' · '+hrs(h)+' h').join('<br>')+'</div>';}
      return `<li class="crew-detail"><div class="panel-b" style="padding-top:0">${inner}</div></li>`;
    }
    const ents=doc.entries, tot=ents.reduce((a,e)=>a+num(e.h),0);
    const dayOpts=sel=>DOW.map((d,i)=>`<option value="${i}"${i===(+sel||0)?' selected':''}>${d} ${parse(addDays(wk,i)).getUTCDate()}</option>`).join('');
    const rows=ents.map((e,i)=>`<tr><td><select data-chg="cwd" data-key="${esc(x.key)}" data-i="${i}" aria-label="Day">${dayOpts(e.d)}</select></td><td><input value="${esc(e.loc||'')}" data-chg="cwl" data-key="${esc(x.key)}" data-i="${i}" autocomplete="off" aria-label="Where"></td><td class="n"><input class="hr" inputmode="decimal" value="${num(e.h)?hrs(num(e.h)):''}" data-chg="cwh" data-key="${esc(x.key)}" data-i="${i}" aria-label="Hours"></td><td class="n"><button type="button" class="btn ghost sm x" data-act="cwDel" data-key="${esc(x.key)}" data-i="${i}" aria-label="Remove row">×</button></td></tr>`).join('');
    return `<li class="crew-detail"><div class="panel-b" style="padding-top:0"><table class="grid ts" style="min-width:0"><thead><tr><th>Day</th><th>Where</th><th class="n">Hours</th><th></th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="2">Total</th><td class="n">${hrs(tot)} h</td><td></td></tr></tfoot></table><div style="margin-top:8px"><button type="button" class="btn ghost sm" data-act="cwAdd" data-key="${esc(x.key)}">+ Add a day</button> <span class="sub">Edits save straight to ${esc(x.name)}'s page.</span></div></div></li>`;};
  const crewPanel=`<section class="panel"><div class="panel-h"><h3>Submitted by the crew</h3><span class="sub">Hours the lads logged on their own page — tap a name to see or edit their week</span></div>${crewSubs.length?`<ul class="items">${crewSubs.map(x=>{const open=ui.crewOpen===x.key;const jobs=Object.entries(x.byLoc).map(([j,h])=>esc(j)+' · '+hrs(h)+'h').join(' &nbsp;·&nbsp; ');return `<li class="item crew-sub${open?' open':''}" data-act="crewWeek" data-key="${esc(x.key)}" role="button" tabindex="0" aria-expanded="${open}"><div class="item-main"><strong>${esc(x.name)}</strong> <span class="chev">${open?'▾':'▸'}</span><div class="sub">${jobs}</div></div><div class="item-amt"><span class="amt">${hrs(x.tot)} h</span></div></li>${open?crewWeek(x):''}`;}).join('')}</ul>`:empty('No crew hours submitted yet','When a lad fills in their hours on their page, they appear here automatically — live.')}</section>`;
  return head+table+byJob+crewPanel;
};

views.dayworks=()=>{
  const head=`<div class="head"><div><h2>Dayworks</h2><p class="sub">Every job, with its day works &amp; variation sheets filed underneath. Add a job, then log sheets against it — on site too.</p></div><div class="item-act"><button type="button" class="btn sm" data-act="newDW" data-mode="dayworks">+ Day works</button><button type="button" class="btn sm ghost" data-act="newDW" data-mode="variation">+ Variation</button><button type="button" class="btn ghost sm" data-act="refreshDW" aria-label="Refresh">↻</button></div></div>`;
  if(!DWDATA.loaded){dwLoad();return head+`<section class="panel">${empty('Loading day works…','')}</section>`;}
  const jobs=DWDATA.jobs,sheets=DWDATA.sheets;
  const byTitle={};sheets.forEach(x=>{const k=x.project||'—';(byTitle[k]=byTitle[k]||[]).push(x);});
  const invOn=id=>!!(S.dw_invoiced[id]&&S.dw_invoiced[id].on);
  // Green "Invoiced" (all ticked), amber "Part-invoiced" (some), grey "Not invoiced" (none yet).
  const invBadge=rows=>{if(!rows.length)return'';const n=rows.filter(x=>invOn(x.id)).length;return n===rows.length?' · <span class="inv-badge">Invoiced</span>':n?' · <span class="inv-badge" style="background:#c9892b">Part-invoiced</span>':' · <span class="inv-badge" style="background:#8a8f99">Not invoiced</span>';};
  const sRow=x=>{const k='dwdel/'+x.id;const act=ui.confirm===k
    ?`<span class="confirm"><button type="button" class="btn sm danger" data-act="delDWSheet" data-id="${esc(x.id)}">Delete sheet</button><button type="button" class="btn sm ghost" data-act="cancel">Keep</button></span>`
    :ui.moveDW===x.id
    ?`<span class="confirm"><select class="dwmove" id="dwmove-${esc(x.id)}" aria-label="Move this sheet to another job"><option value="">Move to job…</option>${jobs.map(j=>`<option value="${esc(j.id)}"${x.project===j.title?' disabled':''}>${esc(j.title)}</option>`).join('')}</select><button type="button" class="btn sm" data-act="moveDWdo" data-id="${esc(x.id)}">Done</button><button type="button" class="btn sm ghost" data-act="cancel">Cancel</button></span>`
    :`<label class="dwinv${invOn(x.id)?' on':''}" title="Tick once you've invoiced this day"><input type="checkbox" data-act="dwInv" data-id="${esc(x.id)}"${invOn(x.id)?' checked':''}> Invoiced</label><button type="button" class="btn sm ghost" data-act="openDWSheet" data-id="${esc(x.id)}">Open</button>${jobs.length?`<button type="button" class="btn sm ghost" data-act="moveDWask" data-id="${esc(x.id)}">Move</button>`:''}<button type="button" class="btn sm ghost" data-act="ask" data-key="${k}" aria-label="Delete sheet">Delete</button>`;
    return `<li class="item"><div class="item-main"><strong>${esc(x.sheet_no||(x.mode==='variation'?'Variation':'Sheet'))}</strong>${x.mode==='variation'?' · Variation':''}<div class="sub">${x.work_date?esc(fmtD(x.work_date)):''}${x.day?' ('+esc(x.day)+')':''}${x.creator_name?' · '+esc(x.creator_name):''}</div></div><div class="item-amt"><span class="amt">${x.grand?money(num(x.grand)):''}</span></div><div class="item-act">${act}</div></li>`;};
  // A collapsible sub-level (month / week) that reuses the dropdown styling but
  // sits inside the job panel rather than being its own panel.
  const subDrop=(key,cls,title,fig,body)=>{const o=!!ui.ovOpen[key];
    return `<div class="dropdown subdrop ${cls}${o?' open':''}"><button type="button" class="dropdown-h" data-act="ovSec" data-k="${esc(key)}" aria-expanded="${o}"><span class="dropdown-t">${title}</span>${fig?`<span class="dropdown-fig">${fig}</span>`:''}<span class="chev">${o?'▴':'▾'}</span></button>${o?body:''}</div>`;};
  const sheetsFig=(rows,tot)=>`${rows.length} sheet${rows.length>1?'s':''}${tot?' · <strong>'+money(tot)+'</strong>':''}`;
  // Group a job's sheets by month, then by week. Each week shows its date span
  // (first → last sheet) and opens to the individual sheets underneath.
  const weekBlock=(title,wk,rows)=>{
    const wrows=rows.slice().sort((a,b)=>String(b.work_date||'').localeCompare(String(a.work_date||'')));
    const dated=wrows.filter(x=>x.work_date).map(x=>x.work_date).sort();
    const span=dated.length?(dated[0]===dated[dated.length-1]?fmtD(dated[0]):fmtD(dated[0])+' – '+fmtD(dated[dated.length-1])):'Undated';
    const tot=wrows.reduce((s,x)=>s+num(x.grand),0);
    const allInv=wrows.length&&wrows.every(x=>invOn(x.id));
    const fig=sheetsFig(wrows,tot)+invBadge(wrows);
    const invWk=`<div class="dw-weeks"><label class="dwinv wk${allInv?' on':''}" title="Mark every day in this week as invoiced"><input type="checkbox" data-act="dwInvWk" data-job="${esc(title)}" data-week="${wk}"${allInv?' checked':''}> Mark whole week invoiced</label></div>`;
    const exp=wk==='—'?'':`<div class="dw-weeks"><span class="sub">Export this week to Excel:</span><button type="button" class="btn sm ghost" data-act="dwWeek" data-job="${esc(title)}" data-week="${wk}">w/e ${fmtD(addDays(wk,6))}</button></div>`;
    const drop=subDrop('dww/'+title+'/'+wk,'week',span,fig,`<ul class="items">${wrows.map(sRow).join('')}</ul>${invWk}${exp}`);
    if(ui.dwPick&&ui.dwPick[title]&&wk!=='—'){
      const on=!!(ui.dwSel&&ui.dwSel[title]&&ui.dwSel[title][wk]);
      return `<div class="dwpick-row${on?' on':''}"><label class="dwpick-cb"><input type="checkbox" data-act="dwPickWk" data-job="${esc(title)}" data-week="${wk}"${on?' checked':''}></label>${drop}</div>`;
    }
    return drop;
  };
  const monthBlock=(title,mk,rows)=>{
    const byWeek={};rows.forEach(x=>{const w=x.work_date?mondayOf(x.work_date):'—';(byWeek[w]=byWeek[w]||[]).push(x);});
    const weeks=Object.keys(byWeek).sort((a,b)=>b.localeCompare(a));
    const tot=rows.reduce((s,x)=>s+num(x.grand),0);
    const lab=mk==='—'?'Undated':MON[+mk.slice(5,7)-1]+' '+mk.slice(0,4);
    return subDrop('dwm/'+title+'/'+mk,'month',lab,sheetsFig(rows,tot)+invBadge(rows),weeks.map(w=>weekBlock(title,w,byWeek[w])).join(''));
  };
  const section=(title,client,jobid,rows)=>{const jb=`data-job="${esc(title)}"${jobid?` data-jobid="${esc(jobid)}"`:''}`;
    const byMonth={};rows.forEach(x=>{const mk=x.work_date?x.work_date.slice(0,7):'—';(byMonth[mk]=byMonth[mk]||[]).push(x);});
    const months=Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
    const weekSet={};rows.forEach(x=>{if(x.work_date)weekSet[mondayOf(x.work_date)]=1;});
    const nWeeks=Object.keys(weekSet).length;
    const picking=!!(ui.dwPick&&ui.dwPick[title]);
    const selCount=picking?Object.keys((ui.dwSel&&ui.dwSel[title])||{}).filter(k=>ui.dwSel[title][k]).length:0;
    const combine=nWeeks>=2?(picking
      ?`<button type="button" class="btn sm" data-act="dwCombineDo" data-job="${esc(title)}"${selCount?'':' disabled'}>Export ${selCount||''} week${selCount===1?'':'s'} together</button><button type="button" class="btn sm ghost" data-act="dwCombineCancel" data-job="${esc(title)}">Cancel</button>`
      :`<button type="button" class="btn sm ghost" data-act="dwCombine" data-job="${esc(title)}">Combine weeks</button>`):'';
    const hint=picking?`<div class="panel-b sub">Tick the weeks you want, then tap “Export weeks together”.</div>`:'';
    const body=rows.length?`${hint}<div class="dw-months">${months.map(mk=>monthBlock(title,mk,byMonth[mk])).join('')}</div>`:`<div class="panel-b sub">No sheets yet.</div>`;
    return `<section class="panel"><div class="panel-h"><h3>${esc(title)}${client?' <span class="sub">'+esc(client)+'</span>':''}${invBadge(rows)}</h3><div class="item-act">${combine}<button type="button" class="btn sm" data-act="newDW" data-mode="dayworks" ${jb}>+ Day works</button><button type="button" class="btn sm ghost" data-act="newDW" data-mode="variation" ${jb}>+ Variation</button></div></div>${body}</section>`;};
  const addJob=`<section class="panel"><div class="panel-h"><h3>Add a job</h3><span class="sub">Create a job so day works &amp; variations can be filed under it.</span></div><form class="panel-b form" data-form="job">${fld('job','title','Job name',"",{attrs:'required',cls:'wide'})}${fld('job','client','Client','')}${fld('job','location','Site address','',{cls:'wide'})}<div class="go"><button class="btn">Add job</button></div></form></section>`;
  const seen={};
  let out=jobs.map(j=>{seen[j.title]=1;return section(j.title,j.client,j.id,(byTitle[j.title]||[]));}).join('');
  Object.keys(byTitle).forEach(t=>{if(!seen[t])out+=section(t,'','',byTitle[t]);});
  if(!jobs.length&&!Object.keys(byTitle).length)return head+addJob+`<section class="panel">${empty('No day works yet','Add a job above, then tap “+ Day works” on it — or create a sheet straight away and it files itself.')}</section>`;
  return head+addJob+out;
};

const opt=a=>a.map(x=>[x,x]);
const quoteFields=(f,q)=>fld(f,'client','Caller / client',q.client,{attrs:'required'})+fld(f,'phone','Phone',q.phone,{type:'tel'})+fld(f,'email','Email',q.email,{type:'email'})+sel(f,'source','Came in by',q.source||'Phone call',opt(SOURCES))+fld(f,'workType','Type of work',q.workType||'',{attrs:'list="dl_work" placeholder="Pick one or type your own…"'})+`<datalist id="dl_work">${WORK.filter(w=>w!=='Other').map(w=>`<option value="${esc(w)}">`).join('')}</datalist>`+fld(f,'job','What they need',q.job,{attrs:'required placeholder="e.g. Footings and drainage for rear extension"',cls:'wide'})+fld(f,'site','Site address / postcode',q.site,{cls:'wide',attrs:'data-addr autocomplete="off"'})+fld(f,'received','Received',q.received,{type:'date'})+fld(f,'due','Quote due',q.due,{type:'date'})+fld(f,'value','Value £ (if known)',nf(q.value||''),{attrs:'inputmode="decimal"'})+area(f,'notes','Notes from the call',q.notes);
const visitPill=(q,today)=>!q.visitDate?'':pill(q.visitDone?'neutral':q.visitDate<today?'bad':q.visitDate===today?'warn':'good',(q.visitDone?'Visited '+fmtD(q.visitDate):'Site visit '+dayLabel(q.visitDate,today)+(q.visitTime?' '+q.visitTime:''))+(q.visitBy?' · '+q.visitBy:''));
views.quotes=()=>{
  const today=todayISO();
