/* ---------- Schedule: drag a job bar across the days to set how long it runs ----------
   Start stays pinned and you drag the end; drag before the start to pull the start earlier.
   A plain tap (no drag) opens the project. */
let jobDrag=null;
function paintJobDrag(){
  if(!jobDrag)return;
  const tds=[...jobDrag.row.querySelectorAll('td.jcell')];
  tds.forEach((td,i)=>{
    const inSpan=i>=jobDrag.min&&i<=jobDrag.max;
    td.innerHTML=inSpan?`<div class="jseg${i===jobDrag.min?' l':''}${i===jobDrag.max?' r':''}" style="--c:var(${jobDrag.color})">${i===jobDrag.min?`<span class="jlabel">${esc(jobDrag.text)}</span>`:''}</div>`:'';
  });
}
view.addEventListener('pointerdown',e=>{
  const td=e.target.closest('tr.jobrow td.jcell[data-jday][data-jid]');if(!td)return;
  const row=td.closest('tr.jobrow');if(!row)return;
  const jid=td.dataset.jid, kind=td.dataset.jkind||'job';
  const tds=[...row.querySelectorAll('td.jcell')];let lo=7,hi=-1;
  tds.forEach((c,i)=>{if(c.querySelector('.jseg')){lo=Math.min(lo,i);hi=Math.max(hi,i);}});
  if(hi<0){lo=hi=+td.dataset.jday;}
  const label=((row.querySelector('.jlabel')||{}).textContent||'').replace(/^‹\s*/,'').replace(/\s*›$/,'');
  const r=(kind==='event'?S.events[jid]:S.projects[jid])||{};
  const oS=kind==='event'?r.from:r.startDate, oE=kind==='event'?(r.from?evEnd(r):''):(r.endDate||r.startDate);
  jobDrag={jid,kind,color:kind==='event'?'--good':'--accent',row,startLo:lo,startHi:hi,min:lo,max:hi,text:label,moved:false,origStart:oS,origEnd:oE,tapDay:td.dataset.sday||''};
  row.classList.add('dragging');
  try{td.setPointerCapture(e.pointerId);}catch(_){}
});
view.addEventListener('pointermove',e=>{
  if(!jobDrag)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const td=el&&el.closest&&el.closest('td.jcell[data-jday]');
  if(!td||td.closest('tr.jobrow')!==jobDrag.row)return;
  const d=+td.dataset.jday;let min,max;
  if(d>=jobDrag.startLo){min=jobDrag.startLo;max=d;}else{min=d;max=jobDrag.startHi;}
  if(min!==jobDrag.min||max!==jobDrag.max){jobDrag.min=min;jobDrag.max=max;jobDrag.moved=true;paintJobDrag();}
});
function endJobDrag(){
  if(!jobDrag)return;const jd=jobDrag;jobDrag=null;jd.row.classList.remove('dragging');
  if(jd.moved){
    const wk=ui.schedWeek, wkEnd=addDays(wk,6);
    let ns=addDays(wk,jd.min), ne=addDays(wk,jd.max);
    if(jd.origStart&&jd.origStart<wk&&jd.min===0)ns=jd.origStart;        // keep a start that began before this week
    if(jd.origEnd&&jd.origEnd>wkEnd&&jd.max===6)ne=jd.origEnd;           // keep an end that runs past this week
    if(jd.kind==='event')write('events',jd.jid,'update',{from:ns,to:ne});
    else write('projects',jd.jid,'update',{startDate:ns,endDate:ne});

    actions.openProject({id:jd.jid});
  }else if(jd.tapDay){
    ui.schedDay=jd.tapDay;ui.focusNext='sd-close';
  }
  schedule();
}

/* ---------- address autocomplete (type → pick the real address) ----------
   Suggestions come from OpenStreetMap's free Nominatim search (UK only, no key).
   Light, debounced manual use only. Picking one fills the field; the Map ↗ link
   then drops a precise pin. */
(function(){
  var box=null,timer=null,ctrl=null,active=null,items=[];
  function close(){if(box){box.remove();box=null;}items=[];active=null;if(ctrl){ctrl.abort();ctrl=null;}}
  function place(inp){
    if(!box)return;var r=inp.getBoundingClientRect();
    box.style.left=(r.left+window.scrollX)+'px';
    box.style.top=(r.bottom+window.scrollY+4)+'px';
    box.style.width=r.width+'px';
  }
  function pick(inp,val){
    inp.value=val;
    inp.dispatchEvent(new Event('input',{bubbles:true}));
    inp.dispatchEvent(new Event('change',{bubbles:true}));
    close();inp.focus();
  }
  var esc2=function(s){return String(s).replace(/[&<>]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;';});};
  /* Build a clean "number street, town, postcode" from Nominatim address parts,
     keeping the house number whenever OSM actually has it. Falls back to the
     display name (minus the country) when parts are sparse. */
  function fmtAddr(x){
    var a=x.address||{};
    var line1=[a.house_number,a.road||a.pedestrian||a.footway].filter(Boolean).join(' ');
    var town=a.town||a.village||a.city||a.hamlet||a.suburb||a.municipality||'';
    var parts=[line1||a.neighbourhood||x.name,town,a.postcode].filter(Boolean);
    var seen={},out=[];
    parts.forEach(function(p){var k=p.toLowerCase();if(!seen[k]){seen[k]=1;out.push(p);}});
    var s=out.join(', ');
    return s||String(x.display_name||'').replace(/,\s*United Kingdom$/i,'').trim();
  }
  function show(inp,results){
    close();active=inp;
    box=document.createElement('div');box.className='addr-sug';
    if(!results.length){box.innerHTML='<div class="addr-none">No matches — type a bit more, or just enter it by hand</div>';}
    else{
      items=results.filter(function(v,i,a){return v&&a.indexOf(v)===i;}).slice(0,6);
      box.innerHTML=items.map(function(v){return '<button type="button" class="addr-item">'+esc2(v)+'</button>';}).join('');
      box.querySelectorAll('.addr-item').forEach(function(b,i){
        b.addEventListener('mousedown',function(e){e.preventDefault();pick(inp,items[i]);});
      });
    }
    document.body.appendChild(box);place(inp);
  }
  /* Prefer addresses in D&C's patch (Dorset / Hampshire / south coast) but still
     find anything else. viewbox = minLon,maxLat,maxLon,minLat; bounded=0 = soft bias. */
  var DC_VIEWBOX='-2.9,51.35,-0.9,50.5';
  function lookup(inp){
    var q=inp.value.trim();
    if(q.length<3){close();return;}
    if(ctrl)ctrl.abort();
    ctrl=('AbortController'in window)?new AbortController():null;
    fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=gb&limit=8&viewbox='+DC_VIEWBOX+'&bounded=0&q='+encodeURIComponent(q),
      {signal:ctrl?ctrl.signal:undefined,headers:{'Accept':'application/json'}})
      .then(function(r){return r.ok?r.json():[];})
      .then(function(list){if(document.activeElement===inp)show(inp,(list||[]).map(fmtAddr));})
      .catch(function(){});
  }
  document.addEventListener('input',function(e){
    var inp=e.target;if(!inp||!inp.hasAttribute||!inp.hasAttribute('data-addr'))return;
    clearTimeout(timer);timer=setTimeout(function(){lookup(inp);},450);
  });
  document.addEventListener('focusout',function(e){
    if(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-addr'))setTimeout(close,120);
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  window.addEventListener('scroll',function(){if(box&&active)place(active);},true);
  window.addEventListener('resize',close);
})();

      sb.auth.signInWithPassword({email,password:pass}).then(r=>{go.disabled=false;go.textContent='Sign in';if(r.error)loginForm(r.error.message||'Sign-in failed');});};
    go.addEventListener('click',submit);
    $('g-pass').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  }
  function deniedView(name){
    showGate('<div style="text-align:center;max-width:360px">'
      +'<img src="assets/logo.png" alt="" style="height:60px;width:60px;border-radius:50%;object-fit:cover;margin:0 auto 12px">'
      +'<div style="font:700 1.5rem var(--display)">Directors only</div>'
      +'<p class="sub" style="color:var(--band-muted);margin:12px 0 18px">Hi '+esc((name||'').split(' ')[0]||'there')+' — the Site Office is for directors. Your day works, variations and timesheets live in the field app.</p>'
      +'<button class="btn" id="g-out" style="background:transparent;color:var(--on-band);border-color:var(--band-muted)">Sign out</button></div>');
    $('g-out').addEventListener('click',()=>sb.auth.signOut());
  }

  /* --- db shim: Firestore-style interface over one office_docs table --- */
  const mapErr=er=>{const e=new Error(er&&er.message||'error');e.code=(navigator.onLine===false)?'unavailable':'invalid_argument';return e;};
  const sbUpsert=(col,id)=>sb.from('office_docs').upsert({collection:col,doc_id:id,data:S[col][id]||{},updated_at:new Date().toISOString()},{onConflict:'collection,doc_id'}).then(r=>{if(r.error)throw mapErr(r.error);return true;});
  const sbDelete=(col,id)=>sb.from('office_docs').delete().eq('collection',col).eq('doc_id',id).then(r=>{if(r.error)throw mapErr(r.error);return true;});
  const sbGetAll=col=>sb.from('office_docs').select('doc_id,data').eq('collection',col).limit(1000).then(r=>{if(r.error)throw mapErr(r.error);return {docs:(r.data||[]).map(x=>({id:x.doc_id,data:()=>x.data||{}}))};});
  const sbShim=()=>({collection:col=>({
    doc:id=>({set:()=>sbUpsert(col,id),update:()=>sbUpsert(col,id),delete:()=>sbDelete(col,id)}),
    limit:()=>({
      get:()=>sbGetAll(col),
      onSnapshot:(onNext,onErr)=>{const load=()=>sbGetAll(col).then(onNext).catch(onErr||(()=>{}));load();
        sb.channel('office-'+col).on('postgres_changes',{event:'*',schema:'public',table:'office_docs',filter:'collection=eq.'+col},load).subscribe();}
    })
  })});

  /* --- assets shim: Supabase Storage for the attached PDFs --- */
  assets={
    upload:(file,opt)=>{
      if(file.size>20*1048576){const e=new Error('too large');e.code='too_large';return Promise.reject(e);}
      const type=(opt&&opt.type)||file.type||'application/octet-stream';
      const path=uid()+'-'+file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');
      return sb.storage.from(BUCKET).upload(path,file,{contentType:type}).then(r=>{if(r.error){const e=new Error(r.error.message);e.code='quota_or_state';throw e;}return {id:path,sizeBytes:file.size};});
    },
    delete:id=>sb.storage.from(BUCKET).remove([id])
  };
  document.addEventListener('click',e=>{
    const a=e.target.closest&&e.target.closest('a[href^="/_blob/"]');if(!a)return;e.preventDefault();
    const path=decodeURIComponent(a.getAttribute('href').slice(7));
    sb.storage.from(BUCKET).createSignedUrl(path,3600).then(r=>{if(r.data&&r.data.signedUrl)window.open(r.data.signedUrl,'_blank');else toast('Could not open document');});
  });

  /* --- header account control --- */
  const clearWho=()=>{const w=$('who'),o=$('hdr-out');if(w)w.textContent='';if(o)o.style.display='none';};
  function setWho(profile){
    const w=$('who'),o=$('hdr-out');
    const nm=((profile&&profile.full_name)||'').trim();
    const first=nm.split(' ')[0]||'there';
    if(w)w.textContent='Welcome '+first+(profile&&profile.role==='director'?' · Director':'');
    if(o){o.style.display='';o.onclick=()=>sb.auth.signOut();}
  }

  /* --- auth flow --- */
  const loadPeople=()=>sb.from('profiles').select('id,full_name,role').then(r=>{if(!r.error){PEOPLE=r.data||[];schedule();}});
  const connect=profile=>{hideGate();setWho(profile);loadPeople();if(profile&&profile.role==='director')xeroLoad();
    dwLoad=()=>Promise.all([
      sb.from('jobs').select('id,title,client,location').order('created_at',{ascending:false}),
      sb.from('sheets').select('id,project,client,sheet_no,work_date,day,grand,creator_name,mode:data->>mode').order('work_date',{ascending:false})
    ]).then(([j,s])=>{DWDATA.jobs=j.data||[];DWDATA.sheets=s.data||[];DWDATA.loaded=true;dwSetSites([...DWDATA.jobs.map(x=>x.location),...Object.values(S.projects||{}).map(p=>p&&p.site)]);dwSetProjects(Object.values(S.projects||{}).filter(p=>p&&p.status==='Live').map(p=>p.name));dwSetClients([...Object.values(S.projects||{}).map(p=>p&&p.client),...DWDATA.jobs.map(x=>x.client)]);schedule();});
    dwRefresh=dwLoad;
    if(!db){db=sbShim();subscribe();}
    fgRefresh=()=>{if(db)COLS.forEach(c=>db.collection(c).limit(1000).get().then(s=>take(c,s)).catch(()=>{}));if(typeof dwLoad==='function')dwLoad();};};

  /* ===== CREW APP — each lad's own page, in the Site Office style ===== */
  /* our lead hand ("top man") gets extra perks — gated by role lead_crew OR
     this email as a fallback so it works before the role is set in Supabase */
  const LEAD_EMAIL='matt@dandcgroundworks.co.uk';
  let crewStarted=false;
  function crewApp(profile,uid,opts){
    opts=opts||{};const lead=!!opts.lead;
    hideGate();setWho(profile);
    if(lead){const w=$('who');if(w)w.textContent=(w.textContent||'')+' · Lead';}
    const CTABS=(lead?[['reminders','Reminders']]:[]).concat([['jobs','Jobs'],['holiday','Holiday'],['hours','My hours']]);
    const cui={tab:CTABS[0][0],week:mondayOf(todayISO())};
    const cS={entries:[],projects:[],sheets:[],jobs:[],files:{},holidays:[],reminders:[]};
    const docId=w=>uid+'__'+w;
    const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    /* a lad can be on 1–3 jobs the same day, so hours are a flat list of
       {id,d:0–6,loc,h} entries — more than one can share a day. Make sure every
       day has at least one (blank) row so the grid always shows Mon–Sun. */
    const normEntries=()=>{for(let i=0;i<7;i++){if(!cS.entries.some(e=>e.d===i))cS.entries.push({id:newId(),d:i,loc:'',h:0});}cS.entries.sort((a,b)=>a.d-b.d);};
    const locOptions=cur=>{const names=[...new Set([...cS.projects.filter(p=>p&&p.status==='Live').map(p=>(p.site||'').trim()||p.name),...cS.jobs.map(j=>j&&((j.location||'').trim()||j.title))].filter(Boolean))];if(cur&&names.indexOf(cur)<0)names.unshift(cur);return '<option value="">— pick where —</option>'+names.map(n=>`<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('');};
    const tabsEl=$('tabs'),viewEl=$('view');
    let saveT=null,saving=false;

    const loadWeek=w=>sb.from('office_docs').select('data').eq('collection','crew_hours').eq('doc_id',docId(w)).maybeSingle()
      .then(r=>{const d=(r.data&&r.data.data)||{};
        if(d.entries&&d.entries.length)cS.entries=d.entries.map(e=>({id:newId(),d:+e.d||0,loc:e.loc||'',h:num(e.h)}));
        else if(d.days&&d.days.length)cS.entries=d.days.map((x,i)=>({id:newId(),d:i,loc:x.loc||'',h:num(x.h)})).filter(e=>e.loc||e.h);
        else if(d.rows&&d.rows.length){cS.entries=[];d.rows.forEach(row=>{(row.h||[]).forEach((h,i)=>{const v=num(h);if(v>0)cS.entries.push({id:newId(),d:i,loc:row.job||row.loc||'',h:v});});});}
        else cS.entries=[];});
    /* crew get ONLY name/site/status of live jobs via a locked-down function —
       never prices, markup, tender, client or notes (see office-schema.sql) */
    const loadProjects=()=>sb.rpc('crew_live_projects').then(r=>{cS.projects=(r.data||[]).filter(p=>p&&p.name);}).catch(()=>{cS.projects=[];});
    const loadSheets=()=>sb.from('sheets').select('id,project,client,sheet_no,work_date,day,mode:data->>mode').order('work_date',{ascending:false}).then(r=>{cS.sheets=r.data||[];});
    const loadJobs=()=>sb.from('jobs').select('id,title,client,location').order('created_at',{ascending:false}).then(r=>{cS.jobs=r.data||[];});
    const loadFiles=()=>sb.from('job_files').select('job_id,name,path,size').then(r=>{const m={};(r.data||[]).forEach(f=>{(m[f.job_id]=m[f.job_id]||[]).push(f);});cS.files=m;});
    /* each lad sees ONLY their own holiday requests (RLS keeps it that way too) */
    const loadHolidays=()=>sb.from('office_docs').select('doc_id,data').eq('collection','holidays').then(r=>{cS.holidays=(r.data||[]).map(x=>({id:x.doc_id,...(x.data||{})})).filter(h=>h.uid===uid).sort((a,b)=>String(b.created||0).localeCompare(String(a.created||0)));}).catch(()=>{cS.holidays=[];});
    /* lead only — private reminders, nobody else's shown */
    const loadReminders=()=>!lead?Promise.resolve():sb.from('office_docs').select('doc_id,data').eq('collection','lead_reminders').then(r=>{cS.reminders=(r.data||[]).map(x=>({id:x.doc_id,...(x.data||{})})).filter(x=>x.uid===uid);}).catch(()=>{cS.reminders=[];});
    /* crew get ONLY material NAMES for the day-works dropdown via a locked-down
       function — never a unit cost or any price (see office-schema.sql) */
    /* …and ONLY plant NAMES (Rates tab, Plant category) — never a rate */
    const loadPlant=()=>sb.rpc('crew_plant').then(r=>{const n=[...new Set((r.data||[]).map(m=>String((m&&(m.desc||m.name))||m||'').trim()).filter(Boolean))];if(n.length)DW_CREW_PLANT=n;}).catch(()=>{});
    const loadMaterials=()=>sb.rpc('crew_materials').then(r=>{const n=[...new Set((r.data||[]).map(m=>String((m&&(m.desc||m.name))||m||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));if(n.length)DW_CREW_MATS=n;}).catch(()=>{});

    const setHint=msg=>{const h=$('c-hint');if(h)h.textContent=msg!=null?msg:(saving?'Saving…':'Saved automatically');};
    function saveHours(submit){
      saving=true;setHint();
      const entries=cS.entries.filter(e=>num(e.h)>0||(e.loc||'').trim()).map(e=>({d:e.d,loc:e.loc||'',h:num(e.h)}));
      const data={uid,name:(profile&&profile.full_name)||'',week:cui.week,entries};
      if(submit)data.submittedAt=new Date().toISOString();/* flags the office's "hours submitted" phone alert */
      return sb.from('office_docs').upsert({collection:'crew_hours',doc_id:docId(cui.week),data,updated_at:new Date().toISOString()},{onConflict:'collection,doc_id'})
        .then(r=>{saving=false;if(r.error){setHint('Not saved — check your connection');toast('Hours not saved. Check your connection.');return false;}setHint('Saved');return true;});
    }
    const queueSave=()=>{clearTimeout(saveT);saving=true;setHint();saveT=setTimeout(saveHours,700);};
    /* Hours save as they type; this is the "I'm finished" tap. End of the week
       (Fri/Sat) they get a thank you from the office. */
    const WEEKEND_MSG='Thank you for a good week lads — enjoy your weekend.';
    const isWeekend=()=>{const d=(parse(todayISO()).getUTCDay()+6)%7;return d===4||d===5;};
    function submitHours(){
      clearTimeout(saveT);
      saveHours(true).then(ok=>{if(!ok)return;cui.sent=todayISO();toast(isWeekend()?WEEKEND_MSG:'Hours sent. Thanks.');render();});
    }

    function updateTotals(){
      let total=0;cS.entries.forEach(e=>total+=num(e.h));
      const g=viewEl.querySelector('[data-cgrand]');if(g)g.textContent=hrs(total);
    }

    function hoursView(){
      const wk=cui.week;normEntries();
      const total=cS.entries.reduce((a,e)=>a+num(e.h),0);
      const head=`<div class="head"><div class="week"><button type="button" class="btn ghost sm" data-cwk="-7" aria-label="Previous week">‹</button><h2>Week commencing ${fmtD(wk,true)}</h2><button type="button" class="btn ghost sm" data-cwk="7" aria-label="Next week">›</button>${wk!==mondayOf(todayISO())?`<button type="button" class="btn ghost sm" data-cwk="0">This week</button>`:''}</div><div class="sub" id="c-hint">Saved automatically</div></div>`;
      const dayBlock=i=>{
        const es=cS.entries.filter(e=>e.d===i);
        const rows=es.map((e,j)=>`<tr class="cday${j>0?' more':''}"><th class="dow${i>4?' we':''}">${j===0?DOW[i]+`<span class="dnum">${parse(addDays(wk,i)).getUTCDate()}</span>`:'<span class="sub">↳</span>'}</th><td class="job"><select data-eid="${e.id}" data-cfield="loc" aria-label="Where on ${DOW[i]}">${locOptions(e.loc||'')}</select></td><td class="n"><input class="hr" inputmode="decimal" autocomplete="off" value="${num(e.h)?hrs(num(e.h)):''}" data-eid="${e.id}" data-cfield="h" aria-label="Hours ${DOW[i]}"></td><td class="x">${es.length>1?`<button type="button" class="btn ghost sm" data-cdel="${e.id}" aria-label="Remove this job">×</button>`:''}</td></tr>`).join('');
        return rows+`<tr class="addrow"><th></th><td colspan="3"><button type="button" class="btn ghost sm" data-caddday="${i}">+ Add another job</button></td></tr>`;
      };
      const body=Array.from({length:7},(_,i)=>dayBlock(i)).join('');
      const table=`<section class="panel"><div class="panel-h"><h3>Your hours, Mon–Sun</h3><span class="sub">Pick where you were, then your hours. On more than one job that day? Tap “+ Add another job”.</span></div><div class="scroll-x"><table class="grid ts cts"><thead><tr><th>Day</th><th>Where</th><th class="n">Hours</th><th></th></tr></thead><tbody>${body}</tbody><tfoot><tr><th>Weekly total</th><td></td><td class="n" data-cgrand>${hrs(total)}</td><td></td></tr></tfoot></table></div></section>`;
      const sent=cui.sent===todayISO();
      const submit=`<section class="panel"><div class="panel-b cform"><button type="button" class="btn" data-csubmit>Submit my hours</button><span class="sub">They save as you type — tap this when you're finished.</span></div>${sent?`<div class="panel-b thanks"><strong>${esc(isWeekend()?WEEKEND_MSG:'Hours sent. Thanks.')}</strong></div>`:''}</section>`;
      return head+table+submit;
    }
    const sheetRow=x=>`<li class="item"><div class="item-main"><strong>${esc(x.sheet_no||(x.mode==='variation'?'Variation':'Sheet'))}</strong>${x.mode==='variation'?' · Variation':''}${x.project?' · '+esc(x.project):''}<div class="sub">${x.work_date?esc(fmtD(x.work_date)):''}${x.day?' ('+esc(x.day)+')':''}</div></div><div class="item-act"><button type="button" class="btn sm ghost" data-copen="${esc(x.id)}">Open</button></div></li>`;
    function jobsView(){
      const j=cS.jobs;
      const byTitle={};cS.sheets.forEach(x=>{const k=x.project||'—';(byTitle[k]=byTitle[k]||[]).push(x);});
      const drawings=files=>files&&files.length?`<div class="panel-b sub" style="padding-top:0"><b>Drawings:</b> ${files.map(f=>`<a class="link" href="/_jobfile/${encodeURIComponent(f.path)}">${esc(f.name)}</a>`).join(' · ')}</div>`:'';
      const section=(title,sub,jobid,rows,files)=>{const jb=`${jobid?`data-cjobid="${esc(jobid)}" `:''}data-cjob="${esc(title)}"`;return `<section class="panel"><div class="panel-h"><h3>${esc(title)}${sub?' <span class="sub">'+esc(sub)+'</span>':''}</h3><div class="item-act"><button type="button" class="btn sm" data-cnew="dayworks" ${jb}>+ Day works</button><button type="button" class="btn sm ghost" data-cnew="variation" ${jb}>+ Variation</button></div></div>${rows.length?`<ul class="items">${rows.map(sheetRow).join('')}</ul>`:`<div class="panel-b sub">No sheets yet.</div>`}${drawings(files)}</section>`;};
      const seen={};
      let out=j.map(x=>{seen[x.title]=1;return section(x.title,[x.client,x.location].filter(Boolean).join(' · '),x.id,(byTitle[x.title]||[]),cS.files[x.id]||[]);}).join('');
      Object.keys(byTitle).forEach(t=>{if(t!=='—'&&!seen[t])out+=section(t,'','',byTitle[t],[]);});
      const head=`<div class="head"><div><h2>Jobs</h2><p class="sub">Pick a job, then add your day works or variation under it — that way it's always filed to the right job.</p></div></div>`;
      if(!j.length&&!Object.keys(byTitle).some(t=>t!=='—'))return head+empty('No jobs yet','Jobs added by the office appear here — then you can log a day works sheet under each one.');
      return head+out;
    }
    function holidayView(){
      const hs=cS.holidays;
      const span=h=>h.from===h.to?fmtD(h.from):fmtD(h.from)+' – '+fmtD(h.to);
      const stpill=h=>h.status==='approved'?pill('good','Approved'):h.status==='declined'?pill('bad','Declined'):pill('warn','Pending');
      const row=h=>`<li class="item"><div>${stpill(h)}</div><div class="item-main"><strong>${esc(span(h))}</strong> <span class="sub">(${num(h.days)||1} day${(num(h.days)||1)>1?'s':''})</span>${h.note?`<div class="sub">${esc(h.note)}</div>`:''}${h.decidedBy?`<div class="sub">${h.status==='approved'?'Approved':'Declined'} by ${esc(h.decidedBy)}</div>`:''}</div><div class="item-act">${h.status==='pending'?`<button type="button" class="btn sm ghost" data-hdel="${esc(h.id)}">Cancel</button>`:''}</div></li>`;
      const today=todayISO();
      const form=`<section class="panel"><div class="panel-h"><h3>Request time off</h3><span class="sub">Pick your dates — the office gets it straight away.</span></div><div class="panel-b form"><label class="f"><span>From</span><input type="date" id="hol-from" min="${today}"></label><label class="f"><span>To</span><input type="date" id="hol-to" min="${today}"></label><label class="f full"><span>Note (optional)</span><input id="hol-note" autocomplete="off" placeholder="e.g. family holiday"></label><div class="go"><button type="button" class="btn" data-hsubmit>Send request</button></div></div></section>`;
      const mine=`<section class="panel"><div class="panel-h"><h3>Your requests</h3></div>${hs.length?`<ul class="items">${hs.map(row).join('')}</ul>`:empty('No requests yet','Pick your dates above to ask for time off.')}</section>`;
      return `<div class="head"><div><h2>Holiday</h2><p class="sub">Ask for time off and see where each request stands.</p></div></div>`+form+mine;
    }
    function reminderView(){
      const open=cS.reminders.filter(r=>!r.done).sort((a,b)=>(b.created||0)-(a.created||0));
      const done=cS.reminders.filter(r=>r.done).sort((a,b)=>(b.created||0)-(a.created||0));
      const row=r=>`<li class="item rem${r.done?' rem-done':''}"><label class="rem-check"><input type="checkbox" data-rdone="${esc(r.id)}"${r.done?' checked':''} aria-label="Mark done"></label><div class="item-main">${esc(r.text)}</div><div class="item-act"><button type="button" class="btn sm ghost x" data-rdel="${esc(r.id)}" aria-label="Delete">×</button></div></li>`;
      const formEl=`<div class="panel-b form rem-add"><label class="f full"><span class="vh">Add a reminder</span><input id="lrem-text" autocomplete="off" placeholder="Add a reminder…"></label><div class="go"><button type="button" class="btn sm" data-radd>Add</button></div></div>`;
      return `<div class="head"><div><h2>Your reminders</h2><p class="sub">Private to you — jot anything you need to remember on site.</p></div></div><section class="panel"><div class="panel-h"><h3>To do <span class="sub">${open.length}</span></h3></div>${formEl}${open.length||done.length?`<ul class="items rem-list">${open.map(row).join('')}${done.length?`<li class="rem-sep">Done · ${done.length}</li>`+done.map(row).join(''):''}</ul>`:empty('Nothing yet','Type anything you need to remember — it saves straight away.')}</section>`;
    }
    function saveHoliday(){
      const f=$('hol-from'),t=$('hol-to'),n=$('hol-note');
      const from=f&&f.value,to=t&&t.value,note=((n&&n.value)||'').trim();
      if(!from||!to){toast('Pick both dates');return;}
      if(to<from){toast('Your “to” date is before the “from” date');return;}
      const days=Math.round((parse(to)-parse(from))/86400000)+1;
      const did=uid+'__'+newId();
      sb.from('office_docs').upsert({collection:'holidays',doc_id:did,data:{uid,name:(profile&&profile.full_name)||'',from,to,days,note,status:'pending',created:Date.now()},updated_at:new Date().toISOString()},{onConflict:'collection,doc_id'})
        .then(r=>{if(r.error){toast('Could not send — check your connection');return;}toast('Holiday request sent');loadHolidays().then(render);});
    }
    function cancelHoliday(id){sb.from('office_docs').delete().eq('collection','holidays').eq('doc_id',id).then(r=>{if(r.error){toast('Could not cancel');return;}toast('Request cancelled');loadHolidays().then(render);});}
    function addLeadRem(){const i=$('lrem-text');const t=((i&&i.value)||'').trim();if(!t)return;sb.from('office_docs').upsert({collection:'lead_reminders',doc_id:uid+'__'+newId(),data:{uid,text:t,done:false,created:Date.now()},updated_at:new Date().toISOString()},{onConflict:'collection,doc_id'}).then(r=>{if(r.error){toast('Not saved — check your connection');return;}loadReminders().then(render);});}
    function setLeadRem(id,done){const r=cS.reminders.find(x=>x.id===id);if(!r)return;sb.from('office_docs').upsert({collection:'lead_reminders',doc_id:id,data:{uid,text:r.text,done:done,created:r.created||Date.now()},updated_at:new Date().toISOString()},{onConflict:'collection,doc_id'}).then(()=>loadReminders().then(render));}
    function delLeadRem(id){sb.from('office_docs').delete().eq('collection','lead_reminders').eq('doc_id',id).then(()=>loadReminders().then(render));}
    function render(){viewEl.innerHTML=cui.tab==='hours'?hoursView():cui.tab==='jobs'?jobsView():cui.tab==='holiday'?holidayView():cui.tab==='reminders'?reminderView():jobsView();}
    function renderTabs(){tabsEl.innerHTML=CTABS.map(([k,l])=>`<button type="button" class="tab" data-ctab="${k}" aria-current="${cui.tab===k?'page':'false'}">${l}</button>`).join('');}

    tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-ctab]');if(!b)return;cui.tab=b.getAttribute('data-ctab');renderTabs();render();});
    viewEl.addEventListener('click',e=>{
      const wk=e.target.closest('[data-cwk]');if(wk){const d=+wk.getAttribute('data-cwk');cui.week=d?mondayOf(addDays(cui.week,d)):mondayOf(todayISO());loadWeek(cui.week).then(render);return;}
      const nw=e.target.closest('[data-cnew]');if(nw){const m=nw.getAttribute('data-cnew');const jt=nw.getAttribute('data-cjob');openDW({mode:m,project:jt||''});return;}
      const op=e.target.closest('[data-copen]');if(op){openDW({id:op.getAttribute('data-copen')});return;}
      if(e.target.closest('[data-csubmit]')){submitHours();return;}
      if(e.target.closest('[data-hsubmit]')){saveHoliday();return;}
      const hd=e.target.closest('[data-hdel]');if(hd){cancelHoliday(hd.getAttribute('data-hdel'));return;}
      if(e.target.closest('[data-radd]')){addLeadRem();return;}
      const rx=e.target.closest('[data-rdel]');if(rx){delLeadRem(rx.getAttribute('data-rdel'));return;}
      const ad=e.target.closest('[data-caddday]');if(ad){cS.entries.push({id:newId(),d:+ad.getAttribute('data-caddday'),loc:'',h:0});render();return;}
      const cd=e.target.closest('[data-cdel]');if(cd){cS.entries=cS.entries.filter(x=>x.id!==cd.getAttribute('data-cdel'));queueSave();render();return;}
    });
    viewEl.addEventListener('input',e=>{const t=e.target;if(t.getAttribute('data-cfield')==='h'&&t.hasAttribute('data-eid')){const en=cS.entries.find(x=>x.id===t.getAttribute('data-eid'));if(en){en.h=num(t.value);updateTotals();queueSave();}}});
    viewEl.addEventListener('change',e=>{const t=e.target;if(t.getAttribute('data-cfield')==='loc'&&t.hasAttribute('data-eid')){const en=cS.entries.find(x=>x.id===t.getAttribute('data-eid'));if(en){en.loc=t.value;queueSave();}return;}const rc=t.closest&&t.closest('[data-rdone]');if(rc){setLeadRem(rc.getAttribute('data-rdone'),rc.checked);}});

    dwRefresh=()=>loadSheets().then(render);
    fgRefresh=()=>{const tasks=[loadProjects(),loadSheets(),loadJobs(),loadFiles(),loadHolidays(),loadReminders()];if(!saving)tasks.unshift(loadWeek(cui.week));return Promise.all(tasks).then(render).catch(()=>{});};
    renderTabs();viewEl.innerHTML='<div class="head"><h2>Loading…</h2></div>';
    loadMaterials();loadPlant();
    Promise.all([loadWeek(cui.week),loadProjects(),loadSheets(),loadJobs(),loadFiles(),loadHolidays(),loadReminders()]).then(()=>{dwSetSites([...cS.jobs.map(j=>j.location),...cS.projects.filter(p=>p&&p.status==='Live').map(p=>p.site)]);dwSetProjects(cS.projects.filter(p=>p&&p.status==='Live').map(p=>p.name));dwSetClients(cS.jobs.map(j=>j&&j.client));render();}).catch(render);
  }
  /* open a job drawing (crew) via a signed URL from the job-files bucket */
  document.addEventListener('click',e=>{
    const a=e.target.closest&&e.target.closest('a[href^="/_jobfile/"]');if(!a)return;e.preventDefault();
    const path=decodeURIComponent(a.getAttribute('href').slice(10));
    sb.storage.from('job-files').createSignedUrl(path,3600).then(r=>{if(r.data&&r.data.signedUrl)window.open(r.data.signedUrl,'_blank');else toast('Could not open document');});
  });

  function check(){
    sb.auth.getSession().then(r=>{
      const s=r.data.session;
      if(!s){clearWho();loginForm('');return;}
      sb.from('profiles').select('full_name,role').eq('id',s.user.id).single().then(p=>{
        const role=(p.data&&p.data.role)||'crew', email=(s.user.email||'').toLowerCase();
        DWME={id:s.user.id,name:(p.data&&p.data.full_name)||'',role};
        if(role==='director'){connect(p.data);if(!PUSH.state){PUSH.state='checking';pushInit();}}
        else if(!crewStarted){crewStarted=true;crewApp(p.data||{},s.user.id,{lead:role==='lead_crew'||email===LEAD_EMAIL});}
      });
    });
  }
  sb.auth.onAuthStateChange(()=>check());
  check();
})();
})();
</script>

</body></html>
