<!DOCTYPE html>
<html lang="en-GB">
<head>

  <title>D&C Groundworks &amp; Civils Ltd — Digital Business Card</title>
  <meta name="description" content="D&C Groundworks & Civils Ltd — Groundworks, Civil Engineering, Patios & Driveways across Dorset & Hampshire. Tap to call, email or save our contact.">
  <meta name="theme-color" content="#273E57">
  <link rel="canonical" href="https://dandcgroundworks.com/card.html">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <meta property="og:title" content="D&C Groundworks & Civils Ltd">
  <meta property="og:description" content="Groundworks & Civil Engineering — Dorset & Hampshire. Tap to call, email or save our contact.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dandcgroundworks.com/card.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#273E57; --navy-dark:#1B2C3E; --navy-light:#3E5975;
      --beige:#EDE7DF; --beige-dark:#D8CFC2; --offwhite:#F7F4EF;
      --font-head:'Oswald','Montserrat',sans-serif;
      --dot:#57d38a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:#fff; min-height:100vh;
      background:linear-gradient(160deg,var(--navy) 0%,var(--navy-dark) 100%);
      display:flex; align-items:center; justify-content:center; padding:24px 16px;
    }
    .card{
      width:100%; max-width:420px; background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.10); border-radius:22px;
      padding:34px 26px 28px; text-align:center;
      box-shadow:0 24px 60px rgba(0,0,0,0.4);
    }
    .logo{width:118px;height:118px;border-radius:50%;background:var(--beige);
      display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
      box-shadow:0 8px 26px rgba(0,0,0,0.35)}
    .logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
    h1{font-family:var(--font-head);font-weight:700;font-size:1.62rem;line-height:1.12;letter-spacing:.3px}
    .tag{color:var(--beige-dark);font-size:.86rem;font-weight:500;margin-top:8px;letter-spacing:.4px}
    .avail{display:inline-flex;align-items:center;gap:8px;margin-top:14px;
      font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--beige)}
    .avail .d{width:9px;height:9px;border-radius:50%;background:var(--dot);
      box-shadow:0 0 0 0 rgba(87,211,138,.7);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(87,211,138,.6)}70%{box-shadow:0 0 0 12px rgba(87,211,138,0)}100%{box-shadow:0 0 0 0 rgba(87,211,138,0)}}
    .services{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0 6px}
    .services span{font-size:.72rem;font-weight:600;color:var(--beige);
      background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.10);
      padding:6px 12px;border-radius:999px}
    .actions{margin-top:20px;display:flex;flex-direction:column;gap:11px}
    .btn{display:flex;align-items:center;gap:14px;width:100%;text-decoration:none;
      padding:14px 18px;border-radius:14px;font-weight:600;font-size:1rem;color:#fff;
      background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
      transition:background .2s ease,transform .12s ease}
    .btn:active{transform:scale(.98)}
    .btn:hover{background:rgba(255,255,255,0.12)}
    .btn .ico{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--navy-light);
      display:flex;align-items:center;justify-content:center}
    .btn .ico svg{width:20px;height:20px;fill:#fff}
    .btn .txt{text-align:left;line-height:1.2}
    .btn .txt small{display:block;font-size:.7rem;font-weight:500;color:var(--beige-dark);letter-spacing:.4px}
    .btn--save{background:var(--beige);color:var(--navy);border-color:var(--beige);justify-content:center;
      font-family:var(--font-head);text-transform:uppercase;letter-spacing:1px;margin-top:5px}
    .btn--save .ico{background:var(--navy)}
    .btn--save:hover{background:#fff}
    .web{display:inline-block;margin-top:20px;color:var(--beige-dark);font-size:.82rem;
      text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.25);padding-bottom:2px}
    .web:hover{color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><img src="assets/logo.png" alt="D&C Groundworks & Civils Ltd"></div>
    <h1>D&amp;C Groundworks<br>&amp; Civils Ltd</h1>
    <p class="tag">Groundworks &amp; Civil Engineering &middot; Dorset &amp; Hampshire</p>
    <div class="avail"><span class="d"></span>Available 24/7</div>

    <div class="services">
      <span>Groundworks</span><span>Civil Engineering</span><span>Patios</span><span>Driveways</span><span>&amp; more</span>
    </div>

    <div class="actions">
      <a class="btn" href="tel:+447891078768">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1L6.6 10.8z"/></svg></span>
        <span class="txt">Call Dan<small>07891 078768</small></span>
      </a>
      <a class="btn" href="tel:+447929958036">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1L6.6 10.8z"/></svg></span>
        <span class="txt">Call Chris<small>07929 958036</small></span>
      </a>
      <a class="btn" href="mailto:office@dandcgroundworks.co.uk">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm8 7L4 6.5V18h16V6.5L12 11z"/></svg></span>
        <span class="txt">Email Us<small>office@dandcgroundworks.co.uk</small></span>
      </a>
      <a class="btn btn--save" href="assets/dandc.vcf" download="D&C Groundworks.vcf">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5zm7-9v2h2v2h-2v2h-2V9h-2V7h2V5h2z"/></svg></span>
        Save Contact
      </a>
    </div>

    <a class="web" href="https://dandcgroundworks.com">View our work &rarr; dandcgroundworks.com</a>
  </main>
</body>
</html>
